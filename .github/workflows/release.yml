name: DE.PULSE | Release G11-G16

on:
  pull_request:
    types: [closed]
    paths:
      - 'release_identity.json'
      - '.github/workflows/release.yml'

permissions:
  contents: read
  actions: read
  statuses: read

concurrency:
  group: depulse-stable-release
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  g11:
    name: G11 Immutable merged candidate/provenance
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && startsWith(github.event.pull_request.head.ref, 'v') && endsWith(github.event.pull_request.head.ref, '-development') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
      source_head_sha: ${{ steps.identity.outputs.source_head_sha }}
      source_pr: ${{ steps.identity.outputs.source_pr }}
      fingerprint: ${{ steps.identity.outputs.fingerprint }}
      version: ${{ steps.identity.outputs.version }}
      build_id: ${{ steps.identity.outputs.build_id }}
      certification_manifest: ${{ steps.identity.outputs.certification_manifest }}
      publication_state: ${{ steps.identity.outputs.publication_state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha='${{ github.event.pull_request.merge_commit_sha }}'
          source_head_sha='${{ github.event.pull_request.head.sha }}'
          source_pr='${{ github.event.pull_request.number }}'
          source_head_ref='${{ github.event.pull_request.head.ref }}'
          test "$(git rev-parse HEAD)" = "$candidate_sha"
          case "$source_head_ref" in v*-development) ;; *) echo "ERROR: release PR head must be v*-development" >&2; exit 2;; esac
          git fetch origin "pull/${source_pr}/head:refs/remotes/origin/pr-source"
          test "$(git rev-parse refs/remotes/origin/pr-source)" = "$source_head_sha"

          python3 release_identity.py --verify
          python3 tools/ci/workflow_policy.py
          readarray -t identity < <(python3 - <<'PY'
          import json
          r=json.load(open('release_identity.json'))
          assert r['channel']=='STABLE', r
          print(r['version'])
          print(r['build_id'])
          print(f"release/v{r['version']}/certification-manifest.json")
          print(r['previous_stable'])
          PY
          )
          version="${identity[0]}"
          build_id="${identity[1]}"
          manifest="${identity[2]}"
          previous_stable="${identity[3]}"
          test -f "$manifest"
          test -f tools/release/run_full_certification.py

          source_fp="$(python3 source_fingerprint.py --mode git --commit "$source_head_sha")"
          candidate_fp="$(python3 source_fingerprint.py --mode git --commit "$candidate_sha")"
          test "$source_fp" = "$candidate_fp"

          statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$source_head_sha/statuses?per_page=100")"
          require_status() {
            context="$1"
            STATUSES="$statuses" CONTEXT="$context" python3 - <<'PY'
          import json, os
          statuses=json.loads(os.environ['STATUSES'])
          context=os.environ['CONTEXT']
          matches=[s for s in statuses if s.get('context')==context]
          matches.sort(key=lambda s: s.get('created_at',''), reverse=True)
          assert matches, f"missing exact-head commit status {context}"
          assert matches[0].get('state')=='success', (context, matches[0].get('state'))
          PY
          }
          require_status 'DE.PULSE/fast-head'
          require_status 'DE.PULSE/qualified-head'

          previous_tag="${previous_stable}-stable"
          previous_ref="$(git ls-remote --refs origin "refs/tags/$previous_tag" | awk 'NR==1{print $1}')"
          if [ -z "$previous_ref" ]; then
            echo "ERROR: declared previous Stable tag $previous_tag does not exist" >&2
            exit 2
          fi

          tag="v${version}-stable"
          existing_ref="$(git ls-remote --refs origin "refs/tags/$tag" | awk 'NR==1{print $1}')"
          if [ -n "$existing_ref" ] && [ "$existing_ref" != "$candidate_sha" ]; then
            echo "ERROR: immutable Stable tag conflict: $tag -> $existing_ref, candidate=$candidate_sha" >&2
            exit 2
          fi
          publication_state=CREATE
          if [ "$existing_ref" = "$candidate_sha" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              publication_state=EXACT_ALREADY_PUBLISHED
            else
              publication_state=TAG_REUSE
            fi
          fi

          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=$source_head_sha" >> "$GITHUB_OUTPUT"
          echo "source_pr=$source_pr" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$candidate_fp" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "certification_manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "publication_state=$publication_state" >> "$GITHUB_OUTPUT"
          {
            echo '## G11 immutable merged candidate'
            echo "- source PR: #$source_pr"
            echo "- qualified source head: \`$source_head_sha\`"
            echo "- merged candidate: \`$candidate_sha\`"
            echo "- fingerprint: \`$candidate_fp\`"
            echo "- canonical G12 manifest: \`$manifest\`"
            echo "- publication feasibility: \`$publication_state\`"
            echo '- exact-head DE.PULSE/fast-head status: PASS'
            echo '- exact-head DE.PULSE/qualified-head status: PASS'
            echo '- source-head → merged-candidate fingerprint equivalence: PASS'
            echo '- previous Stable tag existence: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

  g12:
    name: G12 Full certification
    needs: g11
    if: ${{ needs.g11.result == 'success' && needs.g11.outputs.publication_state != 'EXACT_ALREADY_PUBLISHED' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.g11.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tools/ci/browser-requirements.txt
      - name: Browser prerequisites
        run: python -m pip install --disable-pip-version-check -r tools/ci/browser-requirements.txt
      - name: Verify canonical CI and provenance
        run: |
          python3 tools/ci/workflow_policy.py
          test "$(python3 source_fingerprint.py --mode git --commit '${{ needs.g11.outputs.candidate_sha }}')" = "${{ needs.g11.outputs.fingerprint }}"
      - name: Authoritative version-neutral full certification
        env:
          DEPULSE_EXPECTED_SHA: ${{ needs.g11.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/run_full_certification.py --manifest '${{ needs.g11.outputs.certification_manifest }}'
      - name: Retain G12 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G12
          path: .depulse-certification/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  macos:
    name: G13/G14 macOS Apple Silicon
    needs: [g11, g12]
    if: ${{ needs.g12.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEPULSE_CANDIDATE_SHA: ${{ needs.g11.outputs.candidate_sha }}
      DEPULSE_SOURCE_FINGERPRINT: ${{ needs.g11.outputs.fingerprint }}
      DEPULSE_VERSION: ${{ needs.g11.outputs.version }}
      DEPULSE_BUILD_ID: ${{ needs.g11.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.g11.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Native package + actual packaged runtime audit
        run: bash tools/release/native_macos.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G13-G14-macOS-Apple-Silicon
          path: out/macos-arm64/**
          if-no-files-found: error
          retention-days: 90

  windows:
    name: G13/G14 Windows x64
    needs: [g11, g12]
    if: ${{ needs.g12.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      DEPULSE_CANDIDATE_SHA: ${{ needs.g11.outputs.candidate_sha }}
      DEPULSE_SOURCE_FINGERPRINT: ${{ needs.g11.outputs.fingerprint }}
      DEPULSE_VERSION: ${{ needs.g11.outputs.version }}
      DEPULSE_BUILD_ID: ${{ needs.g11.outputs.build_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.g11.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Native package + actual packaged runtime audit
        shell: pwsh
        run: ./tools/release/native_windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G13-G14-Windows-x64
          path: out/windows-x64/**
          if-no-files-found: error
          retention-days: 90

  g15:
    name: G15 Release Assurance
    needs: [g11, macos, windows]
    if: ${{ needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.g11.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G13-G14-macOS-Apple-Silicon
          path: collected/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G13-G14-Windows-x64
          path: collected/windows
      - name: Bind both native evidence graphs
        run: |
          python3 tools/release/g15_assurance.py \
            --mac-evidence collected/macos/G13-G14-macOS-Apple-Silicon.json \
            --windows-evidence collected/windows/G13-G14-Windows-x64.json \
            --source-sha '${{ needs.g11.outputs.candidate_sha }}' \
            --source-fingerprint '${{ needs.g11.outputs.fingerprint }}' \
            --build-id '${{ needs.g11.outputs.build_id }}' \
            --version '${{ needs.g11.outputs.version }}' \
            --out-dir assurance
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G15-Release-Assurance
          path: assurance/**
          if-no-files-found: error
          retention-days: 365

  publish:
    name: Publish exact same-run certified artifacts
    needs: [g11, g15]
    if: ${{ needs.g15.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.g11.outputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G13-G14-macOS-Apple-Silicon
          path: release-assets/macos
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G13-G14-Windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G15-Release-Assurance
          path: release-assets/g15
      - name: Verify evidence graph and exact binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/release/verify_promotion_evidence.py \
            --g15 release-assets/g15/G15-Release-Assurance.json \
            --mac-evidence release-assets/macos/G13-G14-macOS-Apple-Silicon.json \
            --windows-evidence release-assets/windows/G13-G14-Windows-x64.json \
            --mac-artifact release-assets/macos/De-Pulse-v${{ needs.g11.outputs.version }}-Stable-macOS-Apple-Silicon.zip \
            --windows-artifact release-assets/windows/De-Pulse-v${{ needs.g11.outputs.version }}-Stable-Windows-x64.zip \
            --version '${{ needs.g11.outputs.version }}' \
            --build-id '${{ needs.g11.outputs.build_id }}' \
            --source-fingerprint '${{ needs.g11.outputs.fingerprint }}' \
            --certified-run-head '${{ needs.g11.outputs.candidate_sha }}' \
            --out promotion-verification.json
      - name: Publish Stable release without rebuild or overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.g11.outputs.version }}
          BUILD_ID: ${{ needs.g11.outputs.build_id }}
          CANDIDATE_SHA: ${{ needs.g11.outputs.candidate_sha }}
          SOURCE_FP: ${{ needs.g11.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}-stable"
          existing_ref="$(git ls-remote --refs origin "refs/tags/$tag" | awk 'NR==1{print $1}')"
          if [ -n "$existing_ref" ] && [ "$existing_ref" != "$CANDIDATE_SHA" ]; then
            echo "ERROR: $tag already points to $existing_ref, expected $CANDIDATE_SHA" >&2
            exit 2
          fi
          VERSION="$VERSION" BUILD_ID="$BUILD_ID" CANDIDATE_SHA="$CANDIDATE_SHA" SOURCE_FP="$SOURCE_FP" python3 - <<'PY'
          import os
          from pathlib import Path
          Path('release-notes.md').write_text(
              f"# DE.PULSE v{os.environ['VERSION']} Stable\n\n"
              "- G12 full certification: PASS in this canonical release run\n"
              "- macOS Apple Silicon G13/G14: PASS\n"
              "- Windows x64 G13/G14: PASS\n"
              "- G15 Release Assurance: PASS\n"
              "- No Execution Boundary: PRESERVED\n"
              f"- Certified source: {os.environ['CANDIDATE_SHA']}\n"
              f"- Canonical source fingerprint: {os.environ['SOURCE_FP']}\n"
              f"- Build ID: {os.environ['BUILD_ID']}\n"
              "- Publication uploads the exact artifacts produced and certified in this same workflow run; no rebuild occurs.\n"
              "- Existing Stable assets are reused only when byte-identical; differing bytes are never overwritten.\n"
          )
          PY
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$CANDIDATE_SHA" --title "DE.PULSE v${VERSION} Stable" --notes-file release-notes.md
          fi

          assets=(
            "release-assets/macos/De-Pulse-v${VERSION}-Stable-macOS-Apple-Silicon.zip"
            "release-assets/windows/De-Pulse-v${VERSION}-Stable-Windows-x64.zip"
            "release-assets/macos/G13-G14-macOS-Apple-Silicon.json"
            "release-assets/windows/G13-G14-Windows-x64.json"
            "release-assets/g15/G15-Release-Assurance.json"
            "promotion-verification.json"
          )
          existing_names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          for asset in "${assets[@]}"; do
            name="$(basename "$asset")"
            if printf '%s\n' "$existing_names" | grep -Fxq "$name"; then
              rm -f "$tmp/$name"
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$tmp"
              local_digest="$(sha256sum "$asset" | awk '{print $1}')"
              remote_digest="$(sha256sum "$tmp/$name" | awk '{print $1}')"
              if [ "$local_digest" != "$remote_digest" ]; then
                echo "ERROR: immutable Stable asset conflict for $name: existing=$remote_digest candidate=$local_digest" >&2
                exit 2
              fi
              echo "PASS: existing Stable asset byte-identical; reuse $name"
            else
              gh release upload "$tag" --repo "$GITHUB_REPOSITORY" "$asset"
              echo "PASS: uploaded new immutable Stable asset $name"
            fi
          done
          echo "PASS: published/reused $tag from this exact certified run without rebuilding or overwriting differing bytes"

  g16:
    name: G16 Adaptive release handoff evidence
    needs: [g11, publish]
    if: ${{ always() && needs.g11.result == 'success' && (needs.g11.outputs.publication_state == 'EXACT_ALREADY_PUBLISHED' || needs.publish.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Generate durable G16 workflow result
        env:
          PUBLICATION_STATE: ${{ needs.g11.outputs.publication_state }}
        shell: bash
        run: |
          mkdir -p g16
          if [ "$PUBLICATION_STATE" = EXACT_ALREADY_PUBLISHED ]; then
            certification_state=REUSED_ALREADY_CERTIFIED_STABLE
            native_state=REUSED_ALREADY_CERTIFIED_STABLE
            assurance_state=REUSED_ALREADY_CERTIFIED_STABLE
            publication_result=IDEMPOTENT_NOOP
          else
            certification_state=PASS
            native_state=PASS
            assurance_state=PASS
            publication_result=PASS
          fi
          cat > g16/G16-CI-DELIVERY-SUMMARY.json <<EOF
          {
            "schema": "DE.PULSE-G16-CI-DELIVERY-4",
            "version": "v${{ needs.g11.outputs.version }}",
            "sourcePr": "${{ needs.g11.outputs.source_pr }}",
            "qualifiedSourceHead": "${{ needs.g11.outputs.source_head_sha }}",
            "candidateSha": "${{ needs.g11.outputs.candidate_sha }}",
            "sourceFingerprint": "${{ needs.g11.outputs.fingerprint }}",
            "buildId": "${{ needs.g11.outputs.build_id }}",
            "releaseRunId": "${{ github.run_id }}",
            "mode": "SINGLE_RUN_CERTIFY_AND_PUBLISH_OR_EXACT_IDEMPOTENT_REUSE",
            "publicationFeasibility": "$PUBLICATION_STATE",
            "g10FastExactHead": "PASS",
            "g10QualifiedExactHead": "PASS",
            "g12": "$certification_state",
            "g13g14MacOS": "$native_state",
            "g13g14Windows": "$native_state",
            "g15": "$assurance_state",
            "publication": "$publication_result",
            "canonicalG12Executor": "tools/release/run_full_certification.py",
            "canonicalWorkflows": ["ci-fast.yml", "ci-qualified.yml", "release.yml"],
            "stableAssetsDifferingBytesOverwrite": false,
            "noRebuildPublication": true
          }
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: De-Pulse-v${{ needs.g11.outputs.version }}-G16-Handoff
          path: g16/**
          if-no-files-found: error
          retention-days: 365
