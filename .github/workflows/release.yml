name: DE.PULSE | Release G11-G16

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Immutable candidate SHA (certification base or Stable promotion target)
        required: true
        type: string
      version:
        description: Release version without leading v
        required: true
        type: string
      build_id:
        description: Exact runtime build ID
        required: true
        type: string
      certification_script:
        description: Repository-relative authoritative G12 certification script
        required: true
        default: release/v18.6.0/run_full_certification.sh
        type: string
      expected_source_fingerprint:
        description: Expected canonical Git-object fingerprint
        required: true
        type: string
      publish:
        description: false = certify; true = promotion-only reuse of an already-certified run
        required: true
        default: false
        type: boolean
      certified_run_id:
        description: Successful non-publishing release.yml run whose exact artifacts must be reused when publish=true
        required: false
        type: string
      promotion_sha:
        description: Optional Stable tag target; blank uses candidate_sha. Must preserve certified fingerprint.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: depulse-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  g11:
    name: G11 Immutable candidate/provenance
    if: ${{ inputs.publish == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fingerprint: ${{ steps.identity.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: identity
        shell: bash
        env:
          EXPECTED_FP: ${{ inputs.expected_source_fingerprint }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.candidate_sha }}"
          python3 release_identity.py --verify
          python3 - <<'PY'
          import json
          r=json.load(open('release_identity.json'))
          assert r['version']=='${{ inputs.version }}',r
          assert r['build_id']=='${{ inputs.build_id }}',r
          PY
          fp="$(python3 source_fingerprint.py --mode git --commit '${{ inputs.candidate_sha }}')"
          test "$fp" = "$EXPECTED_FP"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "G11 fingerprint: $fp"

  g12:
    name: G12 Full certification
    if: ${{ inputs.publish == false }}
    needs: g11
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Browser prerequisites
        run: python -m pip install --disable-pip-version-check playwright
      - name: Verify canonical CI and provenance
        run: |
          python3 tools/ci/workflow_policy.py
          test "$(python3 source_fingerprint.py --mode git --commit '${{ inputs.candidate_sha }}')" = "${{ needs.g11.outputs.fingerprint }}"
      - name: Authoritative full certification
        env:
          DEPULSE_EXPECTED_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          script='${{ inputs.certification_script }}'
          test -f "$script"
          bash "$script"
      - name: Retain G12 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v${{ inputs.version }}-G12
          path: .depulse-certification/**
          if-no-files-found: warn
          retention-days: 30

  macos:
    name: G13/G14 macOS Apple Silicon
    if: ${{ inputs.publish == false }}
    needs: [g11, g12]
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEPULSE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DEPULSE_SOURCE_FINGERPRINT: ${{ needs.g11.outputs.fingerprint }}
      DEPULSE_VERSION: ${{ inputs.version }}
      DEPULSE_BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Native package + actual packaged runtime audit
        run: bash tools/release/native_macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v${{ inputs.version }}-G13-G14-macOS-Apple-Silicon
          path: out/macos-arm64/**
          if-no-files-found: error
          retention-days: 90

  windows:
    name: G13/G14 Windows x64
    if: ${{ inputs.publish == false }}
    needs: [g11, g12]
    runs-on: windows-2025
    timeout-minutes: 40
    env:
      DEPULSE_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      DEPULSE_SOURCE_FINGERPRINT: ${{ needs.g11.outputs.fingerprint }}
      DEPULSE_VERSION: ${{ inputs.version }}
      DEPULSE_BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Native package + actual packaged runtime audit
        shell: pwsh
        run: ./tools/release/native_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v${{ inputs.version }}-G13-G14-Windows-x64
          path: out/windows-x64/**
          if-no-files-found: error
          retention-days: 90

  g15:
    name: G15 Release Assurance
    if: ${{ inputs.publish == false }}
    needs: [g11, macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: De-Pulse-v${{ inputs.version }}-G13-G14-macOS-Apple-Silicon
          path: collected/macos
      - uses: actions/download-artifact@v8
        with:
          name: De-Pulse-v${{ inputs.version }}-G13-G14-Windows-x64
          path: collected/windows
      - name: Bind both native evidence graphs
        run: |
          python3 tools/release/g15_assurance.py \
            --mac-evidence collected/macos/G13-G14-macOS-Apple-Silicon.json \
            --windows-evidence collected/windows/G13-G14-Windows-x64.json \
            --source-sha '${{ inputs.candidate_sha }}' \
            --source-fingerprint '${{ needs.g11.outputs.fingerprint }}' \
            --build-id '${{ inputs.build_id }}' \
            --version '${{ inputs.version }}' \
            --out-dir assurance
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v${{ inputs.version }}-G15-Release-Assurance
          path: assurance/**
          if-no-files-found: error
          retention-days: 365

  promote:
    name: G15 Promotion / exact certified artifact publication
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    outputs:
      fingerprint: ${{ steps.guard.outputs.fingerprint }}
      certified_source_sha: ${{ steps.guard.outputs.certified_source_sha }}
      promotion_target: ${{ steps.guard.outputs.promotion_target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.promotion_sha || inputs.candidate_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: guard
        name: Verify certified run + Stable promotion target
        env:
          GH_TOKEN: ${{ github.token }}
          CERTIFIED_RUN_ID: ${{ inputs.certified_run_id }}
          EXPECTED_FP: ${{ inputs.expected_source_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CERTIFIED_RUN_ID" =~ ^[0-9]+$ ]]
          python3 release_identity.py --verify
          python3 - <<'PY'
          import json
          r=json.load(open('release_identity.json'))
          assert r['version']=='${{ inputs.version }}',r
          assert r['build_id']=='${{ inputs.build_id }}',r
          PY
          target="$(git rev-parse HEAD)"
          expected_target='${{ inputs.promotion_sha || inputs.candidate_sha }}'
          test "$target" = "$expected_target"
          fp="$(python3 source_fingerprint.py --mode git --commit "$target")"
          test "$fp" = "$EXPECTED_FP"
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CERTIFIED_RUN_ID")"
          test "$(jq -r '.conclusion' <<< "$run_json")" = success
          test "$(jq -r '.name' <<< "$run_json")" = 'DE.PULSE | Release G11-G16'
          test "$(jq -r '.event' <<< "$run_json")" = workflow_dispatch
          release_line="${{ inputs.version }}"
          release_line="${release_line%.*}"
          test "$(jq -r '.head_branch' <<< "$run_json")" = "v${release_line}-release-certification"
          certified_source_sha="$(jq -r '.head_sha' <<< "$run_json")"
          test -n "$certified_source_sha"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "certified_source_sha=$certified_source_sha" >> "$GITHUB_OUTPUT"
          echo "promotion_target=$target" >> "$GITHUB_OUTPUT"
          echo "PASS: successful canonical certification run $CERTIFIED_RUN_ID binds $certified_source_sha; promotion target $target preserves fingerprint $fp"
      - uses: actions/download-artifact@v8
        with:
          name: De-Pulse-v${{ inputs.version }}-G13-G14-macOS-Apple-Silicon
          path: release-assets/macos
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.certified_run_id }}
      - uses: actions/download-artifact@v8
        with:
          name: De-Pulse-v${{ inputs.version }}-G13-G14-Windows-x64
          path: release-assets/windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.certified_run_id }}
      - uses: actions/download-artifact@v8
        with:
          name: De-Pulse-v${{ inputs.version }}-G15-Release-Assurance
          path: release-assets/g15
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.certified_run_id }}
      - name: Verify exact certified evidence + binary SHA-256
        run: |
          python3 tools/release/verify_promotion_evidence.py \
            --g15 release-assets/g15/G15-Release-Assurance.json \
            --mac-evidence release-assets/macos/G13-G14-macOS-Apple-Silicon.json \
            --windows-evidence release-assets/windows/G13-G14-Windows-x64.json \
            --mac-artifact release-assets/macos/De-Pulse-v${{ inputs.version }}-Stable-macOS-Apple-Silicon.zip \
            --windows-artifact release-assets/windows/De-Pulse-v${{ inputs.version }}-Stable-Windows-x64.zip \
            --version '${{ inputs.version }}' \
            --build-id '${{ inputs.build_id }}' \
            --source-fingerprint '${{ steps.guard.outputs.fingerprint }}' \
            --certified-run-head '${{ steps.guard.outputs.certified_source_sha }}' \
            --out release-assets/G15-Promotion-Verification.json
      - name: Publish exact previously-certified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}-stable"
          target='${{ steps.guard.outputs.promotion_target }}'
          cat > release-notes.md <<EOF
          # DE.PULSE v${{ inputs.version }} Stable

          - Canonical certification run: `${{ inputs.certified_run_id }}`
          - G12 full certification: PASS
          - macOS Apple Silicon G13/G14: PASS
          - Windows x64 G13/G14: PASS
          - G15 Release Assurance: PASS
          - No Execution Boundary: PRESERVED
          - Certified source SHA: `${{ steps.guard.outputs.certified_source_sha }}`
          - Stable promotion target: `${target}`
          - Canonical source fingerprint: `${{ steps.guard.outputs.fingerprint }}`
          - Build ID: `${{ inputs.build_id }}`
          - Publication reuses the exact previously-certified artifacts; G12/G13/G14 are not rebuilt in this promotion run.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing_target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            test "$existing_target" = "$target"
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target" --title "DE.PULSE v${{ inputs.version }} Stable" --notes-file release-notes.md
          fi
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            release-assets/macos/* \
            release-assets/windows/* \
            release-assets/g15/* \
            release-assets/G15-Promotion-Verification.json
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq 'select(.isDraft==false and .isPrerelease==false and .tagName=="v${{ inputs.version }}-stable")' >/dev/null
          echo "PASS: published $tag from certification run ${{ inputs.certified_run_id }} without rebuilding certified assets"

  g16:
    name: G16 Adaptive release handoff evidence
    needs: [g11, g15, promote]
    if: ${{ always() && ((inputs.publish == false && needs.g15.result == 'success') || (inputs.publish && needs.promote.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Generate durable G16 workflow result
        shell: bash
        run: |
          mkdir -p g16
          if [ '${{ inputs.publish }}' = 'true' ]; then
            fingerprint='${{ needs.promote.outputs.fingerprint }}'
            certified_source='${{ needs.promote.outputs.certified_source_sha }}'
            promotion_target='${{ needs.promote.outputs.promotion_target }}'
            publication='PASS'
            evidence_state='REUSED_CERTIFIED_PASS'
            certified_run='${{ inputs.certified_run_id }}'
          else
            fingerprint='${{ needs.g11.outputs.fingerprint }}'
            certified_source='${{ inputs.candidate_sha }}'
            promotion_target=''
            publication='SKIPPED_CERTIFICATION_ONLY'
            evidence_state='PASS'
            certified_run='${{ github.run_id }}'
          fi
          cat > g16/G16-CI-DELIVERY-SUMMARY.json <<EOF
          {
            "schema": "DE.PULSE-G16-CI-DELIVERY-2",
            "version": "v${{ inputs.version }}",
            "candidateSha": "${{ inputs.candidate_sha }}",
            "certifiedSourceSha": "${certified_source}",
            "promotionTarget": "${promotion_target}",
            "sourceFingerprint": "${fingerprint}",
            "buildId": "${{ inputs.build_id }}",
            "certificationRunId": "${certified_run}",
            "g12": "${evidence_state}",
            "g13g14MacOS": "${evidence_state}",
            "g13g14Windows": "${evidence_state}",
            "g15": "${evidence_state}",
            "publication": "${publication}",
            "canonicalWorkflows": ["ci-fast.yml", "ci-qualified.yml", "release.yml"],
            "noRebuildPublication": true
          }
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v${{ inputs.version }}-G16-Handoff
          path: g16/**
          if-no-files-found: error
          retention-days: 365
