name: DE.PULSE v18.2 Documentation Sync 2
on:
  push:
    branches: [v18.2-development]
permissions:
  contents: write
jobs:
  sync:
    if: "github.event.head_commit.message != 'v18.2 align current documentation'"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Sync and verify docs
        run: |
          python3 v18_2_docs_sync.py
          python3 version_consistency_test.py
          python3 documentation_governance_gate.py
      - name: Commit synchronized docs
        run: |
          if ! git diff --quiet -- README.md renderer/docs/user.md renderer/docs/developer.md renderer/docs/limitations.md; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add README.md renderer/docs/user.md renderer/docs/developer.md renderer/docs/limitations.md
            git commit -m 'v18.2 align current documentation'
            git push origin HEAD:v18.2-development
          fi
