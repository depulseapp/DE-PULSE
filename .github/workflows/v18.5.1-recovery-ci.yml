name: DE.PULSE v18.5.1 | Qualification Checkpoint

on:
  push:
    branches: [v18.5.1-development]
    paths:
      - 'release/v18.5.1/QUALIFICATION_CHECKPOINT.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.5.1-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  checkpoint-contract:
    name: Checkpoint · Require deliberate qualification request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checkpoint_sha: ${{ steps.contract.outputs.checkpoint_sha }}
      checkpoint_id: ${{ steps.contract.outputs.checkpoint_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v18.5.1-development
      - id: contract
        name: Validate qualification checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          p = pathlib.Path('release/v18.5.1/QUALIFICATION_CHECKPOINT.json')
          cp = json.loads(p.read_text())
          if cp.get('release') != 'v18.5.1':
              raise SystemExit('checkpoint release must be v18.5.1')
          if cp.get('qualificationRequested') is not True:
              raise SystemExit('qualificationRequested must be true for checkpoint qualification')
          checkpoint_id = str(cp.get('checkpointId') or '').strip()
          source_sha = str(cp.get('sourceSha') or '').strip()
          if not checkpoint_id:
              raise SystemExit('checkpointId is required')
          if len(source_sha) != 40:
              raise SystemExit('sourceSha must be an exact 40-character commit SHA')
          subprocess.run(['git','cat-file','-e',f'{source_sha}^{{commit}}'], check=True)
          subprocess.run(['git','merge-base','--is-ancestor',source_sha,'HEAD'], check=True)
          out = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as fh:
              fh.write(f'checkpoint_sha={source_sha}\n')
              fh.write(f'checkpoint_id={checkpoint_id}\n')
          print(f'Qualification checkpoint {checkpoint_id} bound to {source_sha}')
          PY

  g0-inventory:
    name: G0/G1 · Baseline / identity / frozen scope verification
    needs: [checkpoint-contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      freeze_commit: ${{ steps.freeze.outputs.freeze_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.checkpoint-contract.outputs.checkpoint_sha }}
      - name: Verify exact incoming Stable and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'v18.5.0-stable^{commit}'
          test "$(git rev-parse 'v18.5.0-stable^{commit}')" = '0d37ca35f5fc3ad89cebed506cc5a4c2d6a7a680'
          git merge-base --is-ancestor 'v18.5.0-stable^{commit}' HEAD
      - name: Verify canonical v18.5.1 TEST identity
        run: python3 release_identity.py --verify
      - name: Verify immutable G1 scope
        run: python3 release/v18.5.1/g1_scope_freeze_gate.py --diagnose
      - id: freeze
        name: Bind exact checkpoint source without branch mutation
        shell: bash
        run: echo "freeze_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G0-G1-Freeze
          path: |
            evidence/v18.5.1-G1-scope-diagnostics.json
            release_identity.json
            VERSION.txt
            release/v18.5.1/V18.5.1-G1-PLACEMENT-MAP.json
            release/v18.5.1/G1-SCOPE-FREEZE.json
          if-no-files-found: error
          retention-days: 365

  g1-scope-freeze:
    name: G1 · Immutable ten-ID recovery scope
    needs: [g0-inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - run: |
          python3 release_identity.py --verify
          python3 release/v18.5.1/g1_scope_freeze_gate.py

  fast-static:
    name: G2-G5 · Cheap static qualification
    needs: [g0-inventory, g1-scope-freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Governance and architecture checks
        run: |
          python3 release_identity.py --verify
          python3 adaptive_resume_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 documentation_governance_gate.py
          python3 functionality_utility_checkpoint_gate.py
      - run: go vet ./...

  focused-go:
    name: G5 · Focused affected Go tests
    needs: [g0-inventory, fast-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -count=1 -run '^(TestV170|TestV171|TestV172|TestV174|TestV1851)' ./...

  full-go:
    name: G5 · Full Go development exit
    needs: [g0-inventory, focused-go]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go test -count=1 ./...

  renderer-fast:
    name: G5 · Renderer cheap lane
    needs: [g0-inventory, g1-scope-freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Mandatory renderer syntax contracts
        run: |
          node --check renderer/renderer.js
          node --check renderer/live-dom-reconcile.js
          node --check renderer/watchlist-v18.5.1.js
          node --check renderer/header-v18.5.1.js
          python3 -m py_compile \
            release/v18.5.1/browser_live_render_test.py \
            release/v18.5.1/browser_watchlist_membership_test.py \
            release/v18.5.1/browser_auth_copy_test.py \
            release/v18.5.1/browser_ui_hierarchy_test.py
      - name: Verify v18.5.1 behavior layers are loaded by the actual renderer shell
        run: |
          grep -Fq 'live-dom-reconcile.js?v=18.5.1' renderer/index.html
          grep -Fq 'watchlist-v18.5.1.js?v=18.5.1' renderer/index.html
          grep -Fq 'watchlist-v18.5.1.css?v=18.5.1' renderer/index.html
          grep -Fq 'header-v18.5.1.js?v=18.5.1' renderer/index.html
          grep -Fq 'ui-v18.5.1.css?v=18.5.1' renderer/index.html
          grep -Fq '<title>DE.PULSE v18.5.1</title>' renderer/index.html

  browser-qualified:
    name: G5/G9 · Fast Chromium interaction/content proof
    needs: [g0-inventory, fast-static, renderer-fast]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install lightweight Playwright driver
        run: |
          command -v google-chrome
          python -m pip install --disable-pip-version-check playwright
      - run: python release/v18.5.1/browser_live_render_test.py
      - run: python release/v18.5.1/browser_watchlist_membership_test.py
      - run: python release/v18.5.1/browser_auth_copy_test.py
      - run: python release/v18.5.1/browser_ui_hierarchy_test.py

  qualified-summary:
    name: G5 · Development checkpoint exit
    needs: [checkpoint-contract, g0-inventory, full-go, browser-qualified]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      qualified_source: ${{ needs.g0-inventory.outputs.freeze_commit }}
    steps:
      - name: Require all FAST prerequisite lanes green
        env:
          CHECKPOINT: ${{ needs.checkpoint-contract.result }}
          G0: ${{ needs.g0-inventory.result }}
          FULL_GO: ${{ needs.full-go.result }}
          BROWSER: ${{ needs.browser-qualified.result }}
        run: |
          test "$CHECKPOINT" = success
          test "$G0" = success
          test "$FULL_GO" = success
          test "$BROWSER" = success

  g6-integration-medium:
    name: G6 · Integration & MEDIUM · PostgreSQL / continuity
    needs: [g0-inventory, qualified-summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: depulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d depulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEPULSE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/depulse_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: |
          python3 release_identity.py --verify
          python3 release/v18.5.1/g1_scope_freeze_gate.py
      - name: Real PostgreSQL 17 integration · no skips
        run: |
          mkdir -p evidence
          listing="$(go test -tags postgres -list '^TestV183Postgres' ./...)"
          printf '%s\n' "$listing" | tee evidence/v18.5.1-G6-postgres-selectors.log
          for test in TestV183PostgresRepositoryParityAndWarmStart TestV183PostgresConcurrentWorkspaceWritesStayBounded TestV183PostgresConcurrentMigrationInitializationIsSerialized TestV183PostgresSQLiteArchiveMigratesWithoutLineageLoss TestV183PostgresPoolContentionWaitsWithinConfiguredBound TestV183PostgresHealthCheckReflectsClosedDatabase; do
            printf '%s\n' "$listing" | grep -q "^${test}$" || exit 1
          done
          go test -tags postgres -count=1 -v -run '^TestV183Postgres' ./... 2>&1 | tee evidence/v18.5.1-G6-postgres.log
          ! grep -q -- '--- SKIP: TestV183Postgres' evidence/v18.5.1-G6-postgres.log
      - name: Desktop / readiness / multi-user continuity
        run: |
          selector='^(TestV183DesktopPersistenceRemainsLocalByDefault|TestV183PostgresSelectionFailsClosedWhenUnavailableOrUnconfigured|TestV183ReadinessRequiresCanonicalPersistenceAndIdentity|TestV183PersistenceOutageReadinessRecoversWithBoundedHysteresis|TestV181ProcessingUnionDeduplicatesAndRetainsOtherOwner|TestV181SymbolEventFanoutTargetsWorkspaceOwners|TestV170PersistentCanonicalQuoteWarmStartIsNeverTimelessLiveTruth|TestV1851TestProfileIdentityTruth|TestV1851TestProfileClonesV1850StableWithoutMutatingSource)$'
          go test -count=1 -v -run "$selector" ./... 2>&1 | tee evidence/v18.5.1-G6-continuity.log
          python3 v17_0_cross_platform_persistence_gate.py 2>&1 | tee -a evidence/v18.5.1-G6-continuity.log
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G6-Integration
          path: evidence/v18.5.1-G6-*.log
          if-no-files-found: error
          retention-days: 365

  g7-data-security-adaptive:
    name: G7 · Data, Security & Adaptive Intelligence
    needs: [g0-inventory, qualified-summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Release / architecture / data governance
        run: |
          python3 release_identity.py --verify
          python3 release/v18.5.1/g1_scope_freeze_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 functionality_utility_checkpoint_gate.py
          python3 data_health_policy_gate.py
          python3 adaptive_resume_gate.py
          go vet ./...
      - name: Security, authorization and rights family
        run: |
          mkdir -p evidence
          listing="$(go test -list '^TestV184' ./...)"
          printf '%s\n' "$listing" | tee evidence/v18.5.1-G7-v184-selectors.log
          printf '%s\n' "$listing" | grep -q '^TestV184'
          go test -count=1 -v -run '^TestV184' ./... 2>&1 | tee evidence/v18.5.1-G7-security.log
          python3 v18_4_reauth_ui_gate.py 2>&1 | tee -a evidence/v18.5.1-G7-security.log
          python3 independent_adversarial_authorization_gate.py 2>&1 | tee -a evidence/v18.5.1-G7-security.log
      - run: go test -count=1 -v -run '^TestV1806RapidMoveGovernanceIsExplicitAndCannotAutoPromote$' ./...
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G7-Data-Security
          path: evidence/v18.5.1-G7-*.log
          if-no-files-found: error
          retention-days: 365

  g8-performance-stability:
    name: G8 · Performance, Capacity & Stability
    needs: [g0-inventory, qualified-summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Performance/stability gates
        run: |
          mkdir -p evidence
          python3 v16_11_performance_stability_gate.py 2>&1 | tee evidence/v18.5.1-G8-performance.log
          python3 v16_10_performance_gate.py 2>&1 | tee -a evidence/v18.5.1-G8-performance.log
      - run: go test -race -count=1 -run '^(TestV170|TestV171|TestV172|TestV174|TestV1851)' ./...
      - run: go test -count=5 -shuffle=on ./...
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G8-Performance
          path: evidence/v18.5.1-G8-*.log
          if-no-files-found: error
          retention-days: 365

  g9-cross-module-ui:
    name: G9 · Cross-Module / UI / UX
    needs: [g0-inventory, qualified-summary]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Full HTTP / cross-module functional workflows
        run: |
          mkdir -p evidence
          python3 full_http_functional_workflow.py 2>&1 | tee evidence/v18.5.1-G9-http.log
      - name: Responsive / renderer / professional-trader acceptance
        run: |
          python3 responsive_ui_test.py 2>&1 | tee evidence/v18.5.1-G9-responsive.log
          python3 professional_trader_acceptance_gate.py 2>&1 | tee evidence/v18.5.1-G9-trader.log
      - name: Re-run v18.5.1 browser behavior proofs at qualified source
        run: |
          python -m pip install --disable-pip-version-check playwright
          python release/v18.5.1/browser_live_render_test.py
          python release/v18.5.1/browser_watchlist_membership_test.py
          python release/v18.5.1/browser_auth_copy_test.py
          python release/v18.5.1/browser_ui_hierarchy_test.py
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G9-UI-UX
          path: evidence/v18.5.1-G9-*.log
          if-no-files-found: error
          retention-days: 365

  g10-prefreeze:
    name: G10 · Immutable qualification evidence
    needs: [checkpoint-contract, g0-inventory, g6-integration-medium, g7-data-security-adaptive, g8-performance-stability, g9-cross-module-ui]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - name: Require G6-G9 green and bind exact source/checkpoint
        env:
          G6: ${{ needs.g6-integration-medium.result }}
          G7: ${{ needs.g7-data-security-adaptive.result }}
          G8: ${{ needs.g8-performance-stability.result }}
          G9: ${{ needs.g9-cross-module-ui.result }}
          CHECKPOINT_ID: ${{ needs.checkpoint-contract.outputs.checkpoint_id }}
          SOURCE_SHA: ${{ needs.g0-inventory.outputs.freeze_commit }}
        run: |
          test "$G6" = success
          test "$G7" = success
          test "$G8" = success
          test "$G9" = success
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, pathlib, datetime
          out = {
            'schemaVersion': 1,
            'release': 'v18.5.1',
            'phase': 'G10',
            'status': 'PASS',
            'checkpointId': os.environ['CHECKPOINT_ID'],
            'sourceSha': os.environ['SOURCE_SHA'],
            'checks': {'G6': True, 'G7': True, 'G8': True, 'G9': True},
            'generatedAt': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          pathlib.Path('evidence/v18.5.1-G10-PASS.json').write_text(json.dumps(out, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G10-PASS
          path: evidence/v18.5.1-G10-PASS.json
          if-no-files-found: error
          retention-days: 365
