name: DE.PULSE v18.5.1 | Recovery Control Plane

on:
  push:
    branches: [v18.5.1-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18.5.1-recovery-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  g0-inventory:
    name: G0/G1 · Baseline, conservation and freeze materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      freeze_commit: ${{ steps.freeze.outputs.freeze_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v18.5.1-development
      - name: Verify exact incoming Stable and branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e 'v18.5.0-stable^{commit}'
          test "$(git rev-parse 'v18.5.0-stable^{commit}')" = '0d37ca35f5fc3ad89cebed506cc5a4c2d6a7a680'
          git merge-base --is-ancestor 'v18.5.0-stable^{commit}' HEAD
      - name: Materialize complete G1 placement and freeze overlay
        run: python3 release/v18.5.1/g1_scope_materialize.py --apply
      - name: Validate materialized G1 scope
        run: python3 release/v18.5.1/g1_scope_freeze_gate.py
      - name: Commit generated G1 authority if changed
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'depulseapp'
          git config user.email 'de.pulse.app@gmail.com'
          git add release/v18.5.1/V18.5.1-G1-PLACEMENT-MAP.json release/v18.5.1/G1-SCOPE-FREEZE.json
          if ! git diff --cached --quiet; then
            git commit -m 'governance: freeze v18.5.1 G1 recovery scope'
            git push origin HEAD:v18.5.1-development
          fi
          echo "freeze_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refresh G1 diagnostics on frozen source
        run: python3 release/v18.5.1/g1_scope_freeze_gate.py --diagnose
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G1-Freeze
          path: |
            evidence/v18.5.1-G1-scope-diagnostics.json
            release/v18.5.1/V18.5.1-G1-PLACEMENT-MAP.json
            release/v18.5.1/G1-SCOPE-FREEZE.json
          if-no-files-found: error
          retention-days: 365

  g1-scope-freeze:
    name: G1 · Immutable ten-ID recovery scope
    needs: [g0-inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - name: Enforce hash-bound 295-row conservation and frozen ten-ID slice
        run: python3 release/v18.5.1/g1_scope_freeze_gate.py

  fast-static:
    name: G2-G5 · Cheap static qualification
    needs: [g0-inventory, g1-scope-freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Governance and architecture checks
        shell: bash
        run: |
          set -euo pipefail
          python3 adaptive_resume_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 documentation_governance_gate.py
          python3 functionality_utility_checkpoint_gate.py
      - name: Go static checks
        run: go vet ./...

  focused-go:
    name: G5 · Focused affected Go tests
    needs: [g0-inventory, fast-static]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Recovery-focused inherited families
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^(TestV170|TestV171|TestV172|TestV174)' ./...

  full-go:
    name: G5 · Full Go development exit
    needs: [g0-inventory, focused-go]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go test -count=1 ./...

  renderer-fast:
    name: G5 · Renderer fast lane
    needs: [g0-inventory, g1-scope-freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g0-inventory.outputs.freeze_commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: node --check renderer/renderer.js
      - name: Optional dependency-free renderer contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f renderer_logic_test.py ]; then
            python3 renderer_logic_test.py
          else
            echo 'renderer_logic_test.py is not part of this baseline; syntax gate retained.'
          fi
      - name: Prepare browser contract dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright
          if command -v chromium >/dev/null 2>&1; then
            echo "Using hosted Chromium: $(command -v chromium)"
          elif command -v google-chrome >/dev/null 2>&1; then
            sudo ln -sf "$(command -v google-chrome)" /usr/bin/chromium
            echo "Using hosted Google Chrome through /usr/bin/chromium"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            sudo ln -sf "$(command -v google-chrome-stable)" /usr/bin/chromium
            echo "Using hosted Google Chrome Stable through /usr/bin/chromium"
          else
            python3 -m playwright install --with-deps chromium
            chromium_path="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
            sudo ln -sf "$chromium_path" /usr/bin/chromium
            echo "Using Playwright Chromium fallback through /usr/bin/chromium"
          fi
      - name: Responsive browser contract
        shell: bash
        run: |
          set -euo pipefail
          if [ -f responsive_ui_test.py ]; then
            python3 responsive_ui_test.py
          else
            echo 'No responsive_ui_test.py present in this baseline.'
          fi

  qualified-summary:
    name: G5 · Recovery qualification summary
    needs: [full-go, renderer-fast]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require all prerequisite lanes green
        env:
          FULL_GO: ${{ needs.full-go.result }}
          RENDERER: ${{ needs.renderer-fast.result }}
        run: |
          set -euo pipefail
          test "$FULL_GO" = success
          test "$RENDERER" = success
          echo 'v18.5.1 cheap-first qualification lanes are green.'