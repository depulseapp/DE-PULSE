name: DE.PULSE v18.5.1 | G11 Remaining Preflight

on:
  push:
    branches: [v18.5.1-development]
    paths:
      - '.github/workflows/v18.5.1-renderer-rc-diagnostic.yml'

permissions:
  contents: read

jobs:
  g11-preflight:
    name: Targeted G11 remaining checks preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cd4fb2c0e0dbb28e2f4a501fee5829f1f94b9c74
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Provision responsive browser driver
        run: python3 -m pip install --disable-pip-version-check playwright
      - name: Corrected inherited renderer regression
        run: node release/v18.5.1/renderer_logic_v18_5_1_gate.js
      - name: Current content / release-copy audit
        run: python3 content_copy_audit_test.py
      - name: Documentation typography hierarchy
        run: python3 v18_documentation_typography_gate.py
      - name: Responsive/layout 15-viewport shards
        run: python3 responsive_ui_sharded_gate.py
