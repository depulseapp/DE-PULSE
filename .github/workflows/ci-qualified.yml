name: DE.PULSE | CI Qualified

on:
  pull_request:
    types: [ready_for_review]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source SHA to qualify; blank uses triggering SHA
        required: false
        type: string
      base_sha:
        description: Optional explicit base commit; blank derives merge-base from target_ref
        required: false
        type: string
      target_ref:
        description: Authoritative target branch/ref used when base_sha is blank
        required: true
        default: main
        type: string
      lane:
        description: Qualification lane override; adaptive uses Planner v3 dependency selection
        required: true
        default: adaptive
        type: choice
        options:
          - adaptive
          - full
          - backend
          - renderer
          - browser
          - ci-harness
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      base_sha:
        required: false
        default: ''
        type: string
      target_ref:
        required: false
        default: main
        type: string
      lane:
        required: false
        default: adaptive
        type: string

permissions:
  contents: read

concurrency:
  group: depulse-ci-qualified-${{ github.event.pull_request.number || github.ref }}-${{ inputs.lane || 'adaptive' }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  context:
    name: Resolve qualification identity and Planner v3 impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
      lane: ${{ steps.resolve.outputs.qualified_lane }}
      process_only: ${{ steps.resolve.outputs.process_only }}
      portability_required: ${{ steps.resolve.outputs.portability_required }}
      backend_required: ${{ steps.resolve.outputs.backend_required }}
      renderer_required: ${{ steps.resolve.outputs.renderer_required }}
      chrome_required: ${{ steps.resolve.outputs.chrome_required }}
      webkit_required: ${{ steps.resolve.outputs.webkit_required }}
      security_rights_required: ${{ steps.resolve.outputs.security_rights_required }}
      db_integration_required: ${{ steps.resolve.outputs.db_integration_required }}
      native_macos_required: ${{ steps.resolve.outputs.native_macos_required }}
      native_windows_required: ${{ steps.resolve.outputs.native_windows_required }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      base_resolution: ${{ steps.resolve.outputs.base_resolution }}
      selected_jobs: ${{ steps.resolve.outputs.selected_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: resolve
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.candidate_sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_TARGET_REF: ${{ inputs.target_ref }}
          INPUT_LANE: ${{ inputs.lane }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${PR_HEAD_SHA:-$GITHUB_SHA}}"
          base="${INPUT_BASE_SHA:-${PR_BASE_SHA:-}}"
          target="${PR_BASE_REF:-${INPUT_TARGET_REF:-main}}"
          requested="${INPUT_LANE:-adaptive}"
          test "$(git rev-parse HEAD)" = "$sha"
          python3 tools/ci/impact_plan.py \
            --base "$base" \
            --target-ref "$target" \
            --head "$sha" \
            --requested-lane "$requested" \
            --github-output "$GITHUB_OUTPUT" \
            --json-out ci-qualified-impact-plan.json
          fp="$(python3 source_fingerprint.py --mode git --commit "$sha")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          echo "qualification SHA=$sha fingerprint=$fp base=$(python3 -c \"import json; print(json.load(open('ci-qualified-impact-plan.json'))['baseSha'])\") target=$target mode=$requested selected=$(python3 -c \"import json; print(','.join(json.load(open('ci-qualified-impact-plan.json'))['selectedJobs']))\")"

  ci-harness:
    name: CI/harness contract
    needs: context
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Workflow allowlist and efficiency contract
        run: python3 tools/ci/workflow_policy.py
      - name: Git-object provenance regression
        shell: bash
        run: |
          test "$(python3 source_fingerprint.py --mode git --commit '${{ needs.context.outputs.sha }}')" = "${{ needs.context.outputs.fingerprint }}"
          python3 tools/ci/source_provenance_test.py
      - name: Release identity
        run: python3 release_identity.py --verify
      - name: Python syntax
        run: python3 -m compileall -q tools/ci tools/release source_fingerprint.py

  portability:
    name: CI portability (${{ matrix.os }})
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.portability_required == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Same canonical Git-object fingerprint on this OS
        shell: bash
        if: ${{ runner.os != 'Windows' }}
        run: |
          set -euo pipefail
          actual="$(python3 source_fingerprint.py --mode git --commit '${{ needs.context.outputs.sha }}')"
          test "$actual" = "${{ needs.context.outputs.fingerprint }}"
      - name: Same canonical Git-object fingerprint on Windows
        shell: pwsh
        if: ${{ runner.os == 'Windows' }}
        run: |
          $actual=(python source_fingerprint.py --mode git --commit '${{ needs.context.outputs.sha }}').Trim()
          if($actual -ne '${{ needs.context.outputs.fingerprint }}'){ throw "cross-platform fingerprint mismatch: $actual" }
      - name: Parse reusable native/release tooling
        shell: bash
        if: ${{ runner.os == 'Linux' }}
        run: python3 -m py_compile tools/release/g15_assurance.py tools/ci/workflow_policy.py tools/ci/impact_plan.py tools/ci/webkit_browser_test.py
      - name: Parse reusable macOS harness
        if: ${{ runner.os == 'macOS' }}
        shell: bash
        run: bash -n tools/release/native_macos.sh
      - name: Parse reusable Windows harness
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'tools/release/native_windows.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if($errors.Count -gt 0){ $errors | ForEach-Object { Write-Error $_.Message }; throw 'Windows native harness parse failed' }

  backend:
    name: Qualified backend
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.backend_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l $(git ls-files '*.go'))"
          test -z "$bad" || { printf '%s\n' "$bad"; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: Full Go suite
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Randomized package order
        run: go test -shuffle=on -count=1 ./...

  db-integration:
    name: Qualified persistence / DB integration
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.db_integration_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Persistence-focused regression
        run: go test -count=1 ./... -run 'Test.*(SQLite|Persistence|Migration|Canonical|Cache)'

  security-rights:
    name: Qualified security / data-rights contracts
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.security_rights_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Provider/dependency rights readiness
        run: python3 tools/ci/dependency_readiness_gate.py
      - name: AI rights/offline evaluation contract
        run: python3 tools/ci/ai_continuous_eval_gate.py

  renderer:
    name: Qualified renderer contracts
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.renderer_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Renderer syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find renderer -type f -name '*.js' -print0)
      - name: Protected deterministic equivalence
        run: node tools/ci/deterministic_equivalence_test.js
      - name: Renderer logic regression
        run: node --require ./tools/ci/release_identity_renderer_preload.js renderer_logic_test.js
      - name: v18.0.5 role/responsive regression
        run: node v18_0_5_renderer_test.js
      - name: Documentation capability owner regression
        run: node documentation_ui_owner_test.js

  browser:
    name: Primary Chrome behavior
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.chrome_required == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      cache_hit: ${{ steps.browser_python.outputs.cache-hit }}
      setup_seconds: ${{ steps.browser_prerequisites.outputs.seconds }}
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - id: browser_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tools/ci/browser-requirements.txt
      - id: browser_prerequisites
        name: Browser prerequisites
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          python -m pip install --disable-pip-version-check -r tools/ci/browser-requirements.txt
          end="$(date +%s)"
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"
      - name: Live DOM reconciliation
        run: python3 release/v18.5.1/browser_live_render_test.py
      - name: Watchlist membership semantics
        run: python3 release/v18.6.0/browser_watchlist_membership_test.py
      - name: v18.6.1 global-remove and edge semantics
        run: python3 release/v18.6.1/browser_watchlist_global_remove_test.py
      - name: Master-symbol input semantics
        run: python3 release/v18.5.2/browser_master_symbol_input_test.py
      - name: Profile/display-name semantics
        run: python3 release/v18.5.2/browser_profile_display_name_test.py
      - name: Settings save-bar viewport
        run: python3 release/v18.5.2/browser_settings_save_bar_test.py
      - name: Documentation owner Chrome compatibility
        run: python3 tools/ci/documentation_owner_browser_test.py --engine chrome

  webkit:
    name: Primary WebKit browser compatibility
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.webkit_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      cache_hit: ${{ steps.webkit_python.outputs.cache-hit }}
      setup_seconds: ${{ steps.webkit_prerequisites.outputs.seconds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - id: webkit_python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: tools/ci/browser-requirements.txt
      - id: webkit_prerequisites
        name: WebKit prerequisites
        shell: bash
        run: |
          set -euo pipefail
          start="$(date +%s)"
          python -m pip install --disable-pip-version-check -r tools/ci/browser-requirements.txt
          python -m playwright install webkit
          end="$(date +%s)"
          echo "seconds=$((end-start))" >> "$GITHUB_OUTPUT"
      - name: Primary WebKit browser-only compatibility
        run: python3 tools/ci/webkit_browser_test.py
      - name: Documentation owner WebKit compatibility
        run: python3 tools/ci/documentation_owner_browser_test.py --engine webkit

  native-macos:
    name: Qualified macOS native lifecycle rehearsal
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.native_macos_required == 'true' }}
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Actual packaged macOS lifecycle rehearsal
        shell: bash
        env:
          DEPULSE_CANDIDATE_SHA: ${{ needs.context.outputs.sha }}
          DEPULSE_SOURCE_FINGERPRINT: ${{ needs.context.outputs.fingerprint }}
          DEPULSE_OUTPUT_DIR: ${{ runner.temp }}/depulse-qualified-native-macos
        run: |
          set -euo pipefail
          eval "$(python3 - <<'PY'
          import json, shlex
          r=json.load(open('release_identity.json'))
          print('DEPULSE_VERSION='+shlex.quote(str(r['version'])))
          print('DEPULSE_BUILD_ID='+shlex.quote(str(r['build_id'])))
          PY
          )"
          export DEPULSE_VERSION DEPULSE_BUILD_ID
          bash tools/release/native_macos.sh
      - name: Retain macOS rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DE-PULSE-qualified-native-macos-${{ github.run_id }}-${{ needs.context.outputs.sha }}
          path: ${{ runner.temp }}/depulse-qualified-native-macos/G13-G14-macOS-Apple-Silicon.json
          if-no-files-found: error
          retention-days: 14

  native-windows:
    name: Qualified Windows native runtime rehearsal
    needs: [context, ci-harness]
    if: ${{ needs.context.outputs.native_windows_required == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Actual packaged Windows runtime rehearsal
        shell: pwsh
        env:
          DEPULSE_CANDIDATE_SHA: ${{ needs.context.outputs.sha }}
          DEPULSE_SOURCE_FINGERPRINT: ${{ needs.context.outputs.fingerprint }}
          DEPULSE_OUTPUT_DIR: ${{ runner.temp }}/depulse-qualified-native-windows
        run: |
          $rid=Get-Content -Raw release_identity.json | ConvertFrom-Json
          $env:DEPULSE_VERSION=[string]$rid.version
          $env:DEPULSE_BUILD_ID=[string]$rid.build_id
          & tools/release/native_windows.ps1
          if($LASTEXITCODE -ne 0){ throw 'Windows native rehearsal failed' }
      - name: Retain Windows rehearsal evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DE-PULSE-qualified-native-windows-${{ github.run_id }}-${{ needs.context.outputs.sha }}
          path: ${{ runner.temp }}/depulse-qualified-native-windows/G13-G14-Windows-x64.json
          if-no-files-found: error
          retention-days: 14

  evidence:
    name: Qualified evidence summary
    needs: [context, ci-harness, portability, backend, db-integration, security-rights, renderer, browser, webkit, native-macos, native-windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.context.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require Planner v3 selected jobs to pass
        shell: bash
        env:
          HARNESS: ${{ needs.ci-harness.result }}
          PORTABILITY_REQUIRED: ${{ needs.context.outputs.portability_required }}
          PORTABILITY: ${{ needs.portability.result }}
          BACKEND_REQUIRED: ${{ needs.context.outputs.backend_required }}
          BACKEND: ${{ needs.backend.result }}
          DB_REQUIRED: ${{ needs.context.outputs.db_integration_required }}
          DB: ${{ needs.db-integration.result }}
          SECURITY_REQUIRED: ${{ needs.context.outputs.security_rights_required }}
          SECURITY: ${{ needs.security-rights.result }}
          RENDERER_REQUIRED: ${{ needs.context.outputs.renderer_required }}
          RENDERER: ${{ needs.renderer.result }}
          CHROME_REQUIRED: ${{ needs.context.outputs.chrome_required }}
          CHROME: ${{ needs.browser.result }}
          WEBKIT_REQUIRED: ${{ needs.context.outputs.webkit_required }}
          WEBKIT: ${{ needs.webkit.result }}
          NATIVE_MACOS_REQUIRED: ${{ needs.context.outputs.native_macos_required }}
          NATIVE_MACOS: ${{ needs.native-macos.result }}
          NATIVE_WINDOWS_REQUIRED: ${{ needs.context.outputs.native_windows_required }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
        run: |
          set -euo pipefail
          test "$HARNESS" = success
          require_if(){ flag="$1"; result="$2"; name="$3"; if [ "$flag" = true ]; then test "$result" = success || { echo "$name required result=$result"; exit 1; }; else test "$result" = skipped || { echo "$name unexpected result=$result"; exit 1; }; fi; }
          require_if "$PORTABILITY_REQUIRED" "$PORTABILITY" portability
          require_if "$BACKEND_REQUIRED" "$BACKEND" backend
          require_if "$DB_REQUIRED" "$DB" db-integration
          require_if "$SECURITY_REQUIRED" "$SECURITY" security-rights
          require_if "$RENDERER_REQUIRED" "$RENDERER" renderer
          require_if "$CHROME_REQUIRED" "$CHROME" chrome
          require_if "$WEBKIT_REQUIRED" "$WEBKIT" webkit
          require_if "$NATIVE_MACOS_REQUIRED" "$NATIVE_MACOS" native-macos
          require_if "$NATIVE_WINDOWS_REQUIRED" "$NATIVE_WINDOWS" native-windows
          echo "PASS: Planner v3 selected jobs=${{ needs.context.outputs.selected_jobs }} base=${{ needs.context.outputs.base_sha }} resolution=${{ needs.context.outputs.base_resolution }}"
      - name: Collect CI telemetry
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.context.outputs.sha }}
          LANE: ${{ needs.context.outputs.lane }}
          WEBKIT_REQUIRED: ${{ needs.context.outputs.webkit_required }}
          HEAD_REF: ${{ github.head_ref }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          CHROME_CACHE_HIT: ${{ needs.browser.outputs.cache_hit }}
          CHROME_SETUP_SECONDS: ${{ needs.browser.outputs.setup_seconds }}
          WEBKIT_CACHE_HIT: ${{ needs.webkit.outputs.cache_hit }}
          WEBKIT_SETUP_SECONDS: ${{ needs.webkit.outputs.setup_seconds }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest&per_page=100" > ci-qualified-jobs.json
          if [ -n "${HEAD_REF:-}" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?event=pull_request&branch=$HEAD_REF&per_page=100" > ci-pr-runs.json
          else
            printf '%s\n' '{"workflow_runs":[]}' > ci-pr-runs.json
          fi
          python3 tools/ci/ci_telemetry.py \
            --jobs-json ci-qualified-jobs.json \
            --runs-json ci-pr-runs.json \
            --workflow 'DE.PULSE | CI Qualified' \
            --run-id "$GITHUB_RUN_ID" \
            --candidate-sha "$CANDIDATE_SHA" \
            --lane "$LANE" \
            --webkit-required "$WEBKIT_REQUIRED" \
            --pr-created-at "${PR_CREATED_AT:-}" \
            --chrome-cache-hit "${CHROME_CACHE_HIT:-}" \
            --chrome-setup-seconds "${CHROME_SETUP_SECONDS:-}" \
            --webkit-cache-hit "${WEBKIT_CACHE_HIT:-}" \
            --webkit-setup-seconds "${WEBKIT_SETUP_SECONDS:-}" \
            --output ci-qualified-telemetry.json \
            --summary-output ci-qualified-telemetry.md
          cat ci-qualified-telemetry.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain compact telemetry
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DE-PULSE-ci-telemetry-${{ github.run_id }}-${{ needs.context.outputs.sha }}
          path: ci-qualified-telemetry.json
          if-no-files-found: error
          retention-days: 30
      - name: Record exact-head Qualified status
        if: ${{ success() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_SHA: ${{ needs.context.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$QUALIFIED_SHA" \
            -f state=success \
            -f context='DE.PULSE/qualified-head' \
            -f description='CI Qualified passed exact source head' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
