name: DE.PULSE v18.5.2 | Exact-Source Certification

# Checkpoint-triggered qualification. Ordinary source pushes remain quiet.
# A fingerprint-excluded qualification request under .depulse-certification/resume
# deliberately starts this lane; workflow_dispatch remains available for an
# explicit rerun when the exact source SHA/test contract is unchanged.
on:
  workflow_dispatch:
  push:
    branches:
      - v18.5.2-development
    paths:
      - '.depulse-certification/resume/qualification-request.json'

permissions:
  contents: read

concurrency:
  group: v18.5.2-exact-source-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  exact-source-certification:
    name: G0-G12 exact-source source/browser certification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare Chromium driver
        run: |
          command -v git
          command -v google-chrome
          python -m pip install --disable-pip-version-check playwright

      - name: Run canonical v18.5.2 exact-source certification
        env:
          DEPULSE_EXPECTED_SHA: ${{ github.sha }}
        run: bash release/v18.5.2/run_free_certification.sh

      - name: Retain exact-source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v18.5.2-exact-source-${{ github.sha }}
          path: .depulse-certification/manual-v18.5.2/${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 14
