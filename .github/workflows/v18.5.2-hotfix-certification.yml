name: DE.PULSE v18.5.2 | Hotfix Certification

# Automatic triggers are intentionally disabled while the repository Actions
# budget is unavailable. Keep this workflow for a future explicit paid run;
# use release/v18.5.2/run_free_certification.sh for the no-cost local lane.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.5.2-hotfix-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  go-certification:
    name: Go format, vet and full suite
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Formatting contract
        run: |
          gofmt -w identity_model.go http_auth.go http_api.go v18_5_2_display_name_test.go
          git diff --exit-code
      - run: go vet ./...
      - run: go test -count=1 ./...

  renderer-certification:
    name: Renderer syntax, invariants and Chromium behavior
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Syntax and protected deterministic contracts
        run: |
          node --check renderer/renderer.js
          node --check renderer/live-dom-reconcile.js
          node --check renderer/watchlist-v18.5.1.js
          node --check renderer/header-v18.5.1.js
          node deterministic_equivalence_test.js
          node renderer_logic_test.js
          node v18_0_5_renderer_test.js
          python3 -m py_compile             release/v18.5.1/browser_live_render_test.py             release/v18.5.1/browser_watchlist_membership_test.py             release/v18.5.1/browser_auth_copy_test.py             release/v18.5.1/browser_ui_hierarchy_test.py             release/v18.5.2/browser_master_symbol_input_test.py             release/v18.5.2/browser_profile_display_name_test.py             release/v18.5.2/browser_settings_save_bar_test.py
      - name: Install lightweight Playwright driver
        run: |
          command -v google-chrome
          python -m pip install --disable-pip-version-check playwright
      - name: Browser behavior contracts
        run: |
          python release/v18.5.1/browser_live_render_test.py
          python release/v18.5.1/browser_watchlist_membership_test.py
          python release/v18.5.1/browser_auth_copy_test.py
          python release/v18.5.1/browser_ui_hierarchy_test.py
          python release/v18.5.2/browser_master_symbol_input_test.py
          python release/v18.5.2/browser_profile_display_name_test.py
          python release/v18.5.2/browser_settings_save_bar_test.py

  summary:
    name: Hotfix certification exit
    if: ${{ always() }}
    needs: [go-certification, renderer-certification]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every hotfix lane green
        env:
          GO: ${{ needs.go-certification.result }}
          RENDERER: ${{ needs.renderer-certification.result }}
        run: |
          test "$GO" = success
          test "$RENDERER" = success
