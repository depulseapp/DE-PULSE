name: DE.PULSE v18.5.2 | Exact-Source Certification

# Deliberate checkpoint qualification only. Ordinary source pushes remain quiet.
# Updating the fingerprint-excluded qualification request is the sole automatic
# trigger on the development branch.
on:
  workflow_dispatch:
  push:
    branches:
      - v18.5.2-development
    paths:
      - '.depulse-certification/resume/qualification-request.json'

permissions:
  contents: read

concurrency:
  group: v18.5.2-exact-source-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  PYTHONDONTWRITEBYTECODE: '1'
  SOURCE_SHA: ${{ github.sha }}

jobs:
  exact-source-certification:
    name: G0-G12 exact-source source/browser certification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - name: Checkout exact source SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify qualification request binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          req = json.loads(Path('.depulse-certification/resume/qualification-request.json').read_text())
          assert req.get('qualificationRequested') is True, 'qualificationRequested must be true'
          assert req.get('release') == 'v18.5.2', 'release mismatch'
          assert req.get('branch') == 'v18.5.2-development', 'branch mismatch'
          assert req.get('runner') == 'release/v18.5.2/run_free_certification.sh', 'runner mismatch'
          candidate = req.get('candidateSourceCommit', '')
          assert len(candidate) == 40, 'candidateSourceCommit must be a full SHA'
          source = os.environ['SOURCE_SHA']
          subprocess.run(['git', 'merge-base', '--is-ancestor', candidate, source], check=True)
          print(f'Qualification request bound: candidate={candidate} source={source}')
          PY

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare Chromium driver
        run: |
          command -v git
          command -v google-chrome
          python -m pip install --disable-pip-version-check playwright

      - name: Run canonical v18.5.2 exact-source certification
        env:
          DEPULSE_EXPECTED_SHA: ${{ env.SOURCE_SHA }}
        run: bash release/v18.5.2/run_free_certification.sh

      - name: Retain exact-source evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v18.5.2-exact-source-${{ env.SOURCE_SHA }}
          path: .depulse-certification/manual-v18.5.2/${{ env.SOURCE_SHA }}/
          if-no-files-found: warn
          retention-days: 14
