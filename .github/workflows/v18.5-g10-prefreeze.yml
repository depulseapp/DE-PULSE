name: DE.PULSE v18.5 | G6-G10 Major Closure Pre-Freeze

on:
  push:
    branches: [v18.5-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.5-g6-g10-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '22'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  g6-integration-medium:
    name: G6 · Integration / MEDIUM · PostgreSQL + continuity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: depulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d depulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DEPULSE_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/depulse_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Bind frozen closure contract
        run: |
          set -euo pipefail
          python3 v18_5_scope_gate.py
          python3 v18_5_major_closure_gate.py
      - name: Prove PostgreSQL test selectors exist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          listing="$(go test -tags postgres -list '^TestV183Postgres' ./...)"
          printf '%s\n' "$listing" | tee evidence/G6-postgres-selectors.log
          for test in \
            TestV183PostgresRepositoryParityAndWarmStart \
            TestV183PostgresConcurrentWorkspaceWritesStayBounded \
            TestV183PostgresConcurrentMigrationInitializationIsSerialized \
            TestV183PostgresSQLiteArchiveMigratesWithoutLineageLoss \
            TestV183PostgresPoolContentionWaitsWithinConfiguredBound \
            TestV183PostgresHealthCheckReflectsClosedDatabase; do
            if ! printf '%s\n' "$listing" | grep -q "^${test}$"; then
              echo "::error::Mandatory real PostgreSQL selector missing: ${test}"
              exit 1
            fi
          done
      - name: Real PostgreSQL 17 integration · no skips permitted
        shell: bash
        run: |
          set -euo pipefail
          go test -tags postgres -count=1 -v -run '^TestV183Postgres' ./... 2>&1 | tee evidence/G6-postgres.log
          if grep -q -- '--- SKIP: TestV183Postgres' evidence/G6-postgres.log; then
            echo '::error::Mandatory PostgreSQL test skipped; G6 cannot pass'
            exit 1
          fi
      - name: Desktop / readiness / multi-user continuity
        shell: bash
        run: |
          set -euo pipefail
          selector='^(TestV183DesktopPersistenceRemainsLocalByDefault|TestV183PostgresSelectionFailsClosedWhenUnavailableOrUnconfigured|TestV183ReadinessRequiresCanonicalPersistenceAndIdentity|TestV183PersistenceOutageReadinessRecoversWithBoundedHysteresis|TestV181ProcessingUnionDeduplicatesAndRetainsOtherOwner|TestV181SymbolEventFanoutTargetsWorkspaceOwners|TestV170PersistentCanonicalQuoteWarmStartIsNeverTimelessLiveTruth)$'
          listing="$(go test -list "$selector" ./...)"
          for test in TestV183DesktopPersistenceRemainsLocalByDefault TestV183PostgresSelectionFailsClosedWhenUnavailableOrUnconfigured TestV183ReadinessRequiresCanonicalPersistenceAndIdentity TestV183PersistenceOutageReadinessRecoversWithBoundedHysteresis TestV181ProcessingUnionDeduplicatesAndRetainsOtherOwner TestV181SymbolEventFanoutTargetsWorkspaceOwners TestV170PersistentCanonicalQuoteWarmStartIsNeverTimelessLiveTruth; do
            printf '%s\n' "$listing" | grep -q "^${test}$" || { echo "::error::Missing G6 selector ${test}"; exit 1; }
          done
          go test -count=1 -v -run "$selector" ./... 2>&1 | tee evidence/G6-integration.log
          python3 v17_0_cross_platform_persistence_gate.py 2>&1 | tee -a evidence/G6-integration.log
      - name: Record G6 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          out={'schemaVersion':1,'release':'v18.5.0','gate':'G6','status':'PASS','headCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'checks':{'realPostgres17NoSkip':True,'poolContentionAndHealthTruth':True,'warmStartParity':True,'desktopSQLiteContinuity':True,'readinessRecovery':True,'sharedMultiUserReuse':True},'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('evidence/G6-PASS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.0-G6-Integration
          path: evidence/
          if-no-files-found: error
          retention-days: 365

  g7-data-security-adaptive:
    name: G7 · Data / Security / Adaptive Intelligence
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Architecture / data utility / governance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 release_identity.py --verify
          python3 version_consistency_test.py
          python3 v18_5_scope_gate.py
          python3 v18_5_major_closure_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 functionality_utility_checkpoint_gate.py
          python3 data_health_policy_gate.py
          python3 documentation_governance_gate.py
          python3 adaptive_resume_gate.py
          python3 v18_0_1_principal_engineer_gate.py
          python3 v18_3_principal_engineer_gate.py
          go vet ./...
      - name: Security / auth / rights family must exist and pass
        shell: bash
        run: |
          set -euo pipefail
          listing="$(go test -list '^TestV184' ./...)"
          printf '%s\n' "$listing" | tee evidence/G7-v184-selectors.log
          printf '%s\n' "$listing" | grep -q '^TestV184' || { echo '::error::No v18.4 security/commercial tests found'; exit 1; }
          go test -count=1 -v -run '^TestV184' ./... 2>&1 | tee evidence/G7-security.log
          python3 v18_4_reauth_ui_gate.py 2>&1 | tee -a evidence/G7-security.log
          python3 independent_adversarial_authorization_gate.py 2>&1 | tee -a evidence/G7-security.log
      - name: Adaptive production-governance boundary
        shell: bash
        run: |
          set -euo pipefail
          listing="$(go test -list '^TestV1806RapidMoveGovernanceIsExplicitAndCannotAutoPromote$' ./...)"
          printf '%s\n' "$listing" | grep -q '^TestV1806RapidMoveGovernanceIsExplicitAndCannotAutoPromote$' || { echo '::error::Adaptive governance selector missing'; exit 1; }
          go test -count=1 -v -run '^TestV1806RapidMoveGovernanceIsExplicitAndCannotAutoPromote$' ./... 2>&1 | tee evidence/G7-adaptive.log
      - name: Record G7 evidence
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          out={'schemaVersion':1,'release':'v18.5.0','gate':'G7','status':'PASS','headCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'checks':{'architecture':True,'dataUtility':True,'securityAuthSessionAbuse':True,'providerRightsFailClosed':True,'adaptivePromotionGovernance':True,'principalEngineer':True},'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('evidence/G7-PASS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.0-G7-Data-Security-Adaptive
          path: evidence/
          if-no-files-found: error
          retention-days: 365

  g8-performance-stability:
    name: G8 · Performance / Capacity / Stability · ADR-GDI
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Bind exact 15-scenario matrix
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 v18_5_major_closure_gate.py
      - name: Prove ADR-GDI families exist
        shell: bash
        run: |
          set -euo pipefail
          listing="$(go test -list '^TestV(170|171|172|173|174|1801|1806|181|183)' ./...)"
          printf '%s\n' "$listing" | tee evidence/G8-selectors.log
          for prefix in TestV170 TestV171 TestV172 TestV173 TestV174 TestV1801 TestV1806 TestV181 TestV183; do
            printf '%s\n' "$listing" | grep -q "^${prefix}" || { echo "::error::Missing ADR-GDI family ${prefix}"; exit 1; }
          done
      - name: ADR-GDI scenario qualification
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -v -run '^TestV(170|171|172|173|174|1801|1806|181|183)' ./... 2>&1 | tee evidence/G8-adr-gdi.log
      - name: Performance / capacity / operating envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 v16_11_performance_stability_gate.py 2>&1 | tee evidence/G8-performance.log
          python3 v16_10_performance_gate.py 2>&1 | tee -a evidence/G8-performance.log
          python3 - <<'PY'
          import json,pathlib
          out={'meaning':'certification envelope only; not an advertised production capacity guarantee','radarCandidateBenchmark':500,'promotionStateStressCycles':10000,'symbolRotationStressCount':2000,'postgresConfiguredMaxConnectionsCeiling':128,'evidence':['v16_10_performance_gate.py','v16_11_performance_stability_gate.py','TestV183PostgresPoolConfigurationIsBounded']}
          pathlib.Path('evidence/G8-operating-limits.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - name: Focused concurrency race + CGO fallback
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -run '^(TestV171|TestV172|TestV173|TestV1806|TestV181)' ./...
          CGO_ENABLED=0 go test -count=1 -run '^(TestV170|TestV171|TestV172|TestV173|TestV174|TestV1801|TestV1806|TestV181)' ./...
      - name: Record G8 evidence
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          out={'schemaVersion':1,'release':'v18.5.0','gate':'G8','status':'PASS','headCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'adrGdiScenarioCount':15,'checks':{'providerFailureRateLimit':True,'staleEvidenceSLO':True,'sourceDisagreement':True,'blastRadius':True,'boundedBackpressure':True,'priorityLoadShedding':True,'duplicateWorkAvoidance':True,'recoveryHysteresis':True,'unknownDegradedTruth':True,'supportedOperatingEnvelope':True,'focusedRace':True,'cgoFallback':True},'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('evidence/G8-PASS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.0-G8-Performance-Stability
          path: evidence/
          if-no-files-found: error
          retention-days: 365

  g9-cross-module-ui-ux:
    name: G9 · Cross-Module / UI / UX · Runtime truth
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
      - name: Renderer / deterministic / role-aware acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --check renderer/renderer.js
          node renderer_logic_test.js
          node v18_0_5_renderer_test.js
          node v18_2_renderer_test.js
          node deterministic_equivalence_test.js
          node trader_acceptance_test.js
      - name: Provision Chromium runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
          P="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          test -x "$P"
          sudo ln -sf "$P" /usr/bin/chromium
      - name: HTTP / responsive / packaged-runtime degradation UX
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 http_workflow_test.py
            python3 responsive_ui_sharded_gate.py
            python3 professional_expert_gate.py
            node v17_5_real_money_acceptance_test.js
            python3 v17_5_trader_investor_gate.py
          } 2>&1 | tee evidence/G9-runtime-ui.log
      - name: Record G9 evidence
        run: |
          python3 - <<'PY'
          import datetime,json,pathlib,subprocess
          out={'schemaVersion':1,'release':'v18.5.0','gate':'G9','status':'PASS','headCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'checks':{'renderer':True,'deterministic':True,'browserHTTP':True,'responsive':True,'degradationRuntimeTruth':True,'professionalTraderInvestor':True},'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          pathlib.Path('evidence/G9-PASS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.0-G9-UI-UX-Runtime
          path: evidence/
          if-no-files-found: error
          retention-days: 365

  g10-prefreeze:
    name: G10 · Pre-Freeze · Exact candidate evidence
    needs: [g6-integration-medium, g7-data-security-adaptive, g8-performance-stability, g9-cross-module-ui-ux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: false
      - name: Rebind identity / scope / closure contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 release_identity.py --verify
          python3 version_consistency_test.py
          python3 v18_5_scope_gate.py
          python3 v18_5_major_closure_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 documentation_governance_gate.py
      - name: Randomized / Extreme-30 / approved-scope qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 randomized_order_gate.py
          python3 extreme_30_gate.py
          python3 approved_scope_gate.py
      - name: Freeze exact G10 candidate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          FP="$(python3 ci_pipeline.py --fingerprint)"
          HEAD_SHA="$(git rev-parse HEAD)"
          printf '%s\n' "$FP" > evidence/v18.5-G10-source-fingerprint.txt
          python3 - "$FP" "$HEAD_SHA" <<'PY'
          import datetime,json,pathlib,sys
          scope=json.loads(pathlib.Path('v18_5_scope.json').read_text())
          out={
            'schemaVersion':1,
            'release':'v18.5.0 TEST',
            'gateRange':'G0-G10',
            'status':'PASS',
            'headCommit':sys.argv[2],
            'sourceFingerprint':sys.argv[1],
            'adrGdiScenarios':scope['adrGdiRequiredScenarios'],
            'adrGdiScenarioCount':len(scope['adrGdiRequiredScenarios']),
            'closureDimensions':scope['closureDimensions'],
            'nativeDeliveryState':'REQUIRED_BEFORE_G15_NOT_YET_CLAIMED',
            'nativeDeliveryRequired':['macOS Apple Silicon runnable ZIP','Windows x64 runnable ZIP','exact source ZIP','SHA-256 manifest','certification evidence','GitHub Release listing runnable assets'],
            'decision':'ELIGIBLE_FOR_G11_IMMUTABLE_RC_ONLY_IF_THIS_EXACT_SOURCE_IS_FROZEN',
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('evidence/v18.5-G10-PASS.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.0-G10-Pre-Freeze-Evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 365
