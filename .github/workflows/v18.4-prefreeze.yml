name: DE.PULSE v18.4 | G9-G10 | Pre-Freeze Qualification

on:
  push:
    branches: [v18.4-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.4-prefreeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: G9-G10 · Candidate · Pre-Freeze Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Rebind G0-G4 · Identity, Scope, Architecture, Security & Data Utility
        shell: bash
        run: |
          set -euo pipefail
          python3 release_identity.py --verify
          python3 version_consistency_test.py
          python3 canonical_naming_gate.py
          python3 adaptive_resume_gate.py
          python3 v18_4_scope_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 functionality_utility_checkpoint_gate.py
          python3 data_health_policy_gate.py
          python3 documentation_governance_gate.py
          python3 v18_4_reauth_ui_gate.py
          test "$(git merge-base HEAD 35ef2a161e6a01c4f22fd0c9aecbe8920a7dace2)" = "35ef2a161e6a01c4f22fd0c9aecbe8920a7dace2"
          git diff --exit-code 35ef2a161e6a01c4f22fd0c9aecbe8920a7dace2...HEAD -- scanner.go preparation_types_liquidity.go validation_learning.go signal_validation.go persistence_backend_postgres.go persistence_repository.go
      - name: Reconcile G5-G8 · v18.4 + inherited + full Go qualification
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestV184' ./...
          go test -count=1 -run '^TestV183' ./...
          go test -count=1 -run '^TestV182' ./...
          go test -count=1 -run '^TestV181' ./...
          go test -count=1 -run '^TestV1806' ./...
          go test -count=1 ./...
          go vet ./...
          CGO_ENABLED=0 go test -count=1 ./...
      - name: G8 · Windows x64 compile
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/De-Pulse-v18.4.0-TEST.exe .
      - name: G9 · Renderer · Deterministic + professional acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check renderer/renderer.js
          node renderer_logic_test.js
          node v18_0_5_renderer_test.js
          node v18_2_renderer_test.js
          node deterministic_equivalence_test.js
          node trader_acceptance_test.js
      - name: G9 · Browser · Provision responsive runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
          P="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          test -x "$P"
          sudo ln -sf "$P" /usr/bin/chromium
      - name: G9 · HTTP and responsive qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 http_workflow_test.py
          python3 responsive_ui_sharded_gate.py
      - name: G10 · Randomized and Extreme 30 qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 randomized_order_gate.py
          python3 extreme_30_gate.py
      - name: G10 · Freeze candidate fingerprint and evidence
        shell: bash
        run: |
          set -euo pipefail
          FP="$(python3 ci_pipeline.py --fingerprint)"
          printf '%s\n' "$FP" | tee v18.4-G10-source-fingerprint.txt
          python3 - "$FP" > v18.4-G10-PASS.json <<'PY'
          import json,sys,datetime
          print(json.dumps({
            'schemaVersion':1,
            'gateRange':'G0-G10',
            'status':'PASS',
            'release':'v18.4.0 TEST',
            'sourceFingerprint':sys.argv[1],
            'incomingStable':'v18.3.0',
            'checks':{
              'identity':True,'scope':True,'architecture':True,'sourceHealth':True,'dataUtility':True,'dataHealth':True,
              'v184SecurityCommercial':True,'reauthUI':True,'v183Regression':True,'v182Regression':True,'v181Regression':True,
              'fullGo':True,'vet':True,'cgoFallback':True,'windowsCompile':True,
              'renderer':True,'deterministic':True,'professionalAcceptance':True,'http':True,'responsive':True,
              'randomized':True,'extreme30':True,'protectedMarketAndPersistenceOwners':True
            },
            'commercialRightsPolicy':'fail-closed-unless-evidence-bound',
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.4.0-TEST-G10-Pre-Freeze-Evidence
          path: |
            v18.4-G10-source-fingerprint.txt
            v18.4-G10-PASS.json
          retention-days: 180
