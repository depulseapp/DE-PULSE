name: DE.PULSE v18.2 G4-G10 Pre-Freeze

on:
  push:
    branches: [v18.2-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.2-prefreeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: G0-G4 identity scope architecture
        run: |
          set -euo pipefail
          python3 release_identity.py --verify
          python3 version_consistency_test.py
          python3 v18_2_scope_gate.py
          python3 v18_2_principal_engineer_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 data_health_policy_gate.py
          python3 documentation_governance_gate.py
          test "$(git merge-base HEAD 4b48c61ee103897e834f4ff7d24af07d4275a62c)" = "4b48c61ee103897e834f4ff7d24af07d4275a62c"
      - name: Focused and inherited Go qualification
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestV182' ./...
          go test -count=1 -run '^TestV181' ./...
          go test -count=1 -run '^TestV1806' ./...
          go test -count=1 ./...
          go vet ./...
      - name: CGO-disabled persistence fallback
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: Windows x64 compile
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/De-Pulse-v18.2.0-TEST.exe .
      - name: Renderer and deterministic acceptance
        run: |
          set -euo pipefail
          node renderer_logic_test.js
          node v18_0_5_renderer_test.js
          node v18_2_renderer_test.js
          node deterministic_equivalence_test.js
          node trader_acceptance_test.js
      - name: Provision responsive browser
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
          P="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          test -x "$P"
          sudo ln -sf "$P" /usr/bin/chromium
      - name: HTTP workflow and responsive UI
        run: |
          set -euo pipefail
          python3 http_workflow_test.py
          python3 responsive_ui_sharded_gate.py
      - name: Randomized and extreme regressions
        run: |
          set -euo pipefail
          python3 randomized_order_gate.py
          python3 extreme_30_gate.py
      - name: Freeze G10 fingerprint evidence
        run: |
          set -euo pipefail
          FP="$(python3 ci_pipeline.py --fingerprint)"
          printf '%s\n' "$FP" | tee v18.2-G10-source-fingerprint.txt
          python3 - "$FP" > v18.2-G10-PASS.json <<'PY'
          import json,sys,datetime
          print(json.dumps({'schemaVersion':1,'gateRange':'G4-G10','status':'PASS','release':'v18.2.0 TEST','sourceFingerprint':sys.argv[1],'incomingStable':'v18.1.0','checks':{'scope':True,'architecture':True,'sourceHealth':True,'dataUtility':True,'dataHealth':True,'focusedV182':True,'v181Regression':True,'routerRapidMoveRegression':True,'fullGo':True,'vet':True,'cgoFallback':True,'windowsCompile':True,'renderer':True,'deterministic':True,'trader':True,'http':True,'responsive':True,'randomized':True,'extreme30':True},'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()},indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.2.0-G10-PreFreeze
          path: |
            v18.2-G10-source-fingerprint.txt
            v18.2-G10-PASS.json
          retention-days: 90
