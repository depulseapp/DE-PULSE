name: DE.PULSE v18.4 Reauthentication Builder

on:
  push:
    branches: [v18.4-development]
    paths:
      - '.github/workflows/v18.4-reauth-builder.yml'
      - '.depulse-build/v18_4_reauth_apply.py'
      - '.depulse-build/identity_reauth.go.payload'
      - '.depulse-build/v18_4_reauth_test.go.payload'
      - '.depulse-build/v18_4_reauth_ui_gate.py.payload'

permissions:
  contents: write

concurrency:
  group: v18.4-reauth-builder
  cancel-in-progress: false

jobs:
  reauthentication:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Apply bounded adversarial-reauth delta
        run: |
          set -euo pipefail
          git merge-base --is-ancestor '869a0973d7cbf40356d81516dccce9741a4d16d1' HEAD
          git diff --exit-code '869a0973d7cbf40356d81516dccce9741a4d16d1...HEAD' -- '*.go' 'renderer/*.js' 'renderer/*.css' 'v18_4_reauth_ui_gate.py' '.github/workflows/v18.4-dev-ci.yml'
          python3 .depulse-build/v18_4_reauth_apply.py
          gofmt -w identity_reauth.go http_auth.go http_api.go v18_4_reauth_test.go
      - name: Qualify adversarial-reauth delta
        run: |
          set -euo pipefail
          python3 source_health_architecture_gate.py
          python3 v18_4_scope_gate.py
          python3 v18_4_reauth_ui_gate.py
          node --check renderer/renderer.js
          go test -count=1 -run '^TestV184' ./...
          go test -count=1 ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/depulse-v184-reauth-windows.test .
      - name: Publish qualified adversarial-reauth delta
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- identity_reauth.go http_auth.go http_api.go renderer/renderer.js v18_4_reauth_test.go v18_4_reauth_ui_gate.py .github/workflows/v18.4-dev-ci.yml
          git commit -m 'v18.4: require recent authentication for sensitive mutations'
          git push origin HEAD:v18.4-development
