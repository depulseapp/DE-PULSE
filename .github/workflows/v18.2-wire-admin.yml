name: DE.PULSE v18.2 Wire Admin Surface

on:
  push:
    branches: [v18.2-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18.2-wire-admin
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Wire role-aware admin endpoints and live-session lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('http_api.go')
          s=p.read_text()
          anchor='\tmux.HandleFunc("/api/events", a.auth(a.handleEvents))\n'
          routes='''\tmux.HandleFunc("/api/admin/identity", a.requireRole(RoleAdmin, a.handleAdminIdentity))
          \tmux.HandleFunc("/api/admin/users/create", a.requireRole(RoleAdmin, postOnly(a.handleAdminUserCreate)))
          \tmux.HandleFunc("/api/admin/users/role", a.requireRole(RoleAdmin, postOnly(a.handleAdminUserRole)))
          \tmux.HandleFunc("/api/admin/users/status", a.requireRole(RoleAdmin, postOnly(a.handleAdminUserStatus)))
          \tmux.HandleFunc("/api/admin/users/reset-password", a.requireRole(RoleAdmin, postOnly(a.handleAdminPasswordReset)))
          \tmux.HandleFunc("/api/admin/sessions/revoke", a.requireRole(RoleAdmin, postOnly(a.handleAdminSessionRevoke)))
          '''
          if '/api/admin/identity' not in s:
              if anchor not in s: raise SystemExit('events route anchor missing')
              s=s.replace(anchor,anchor+routes,1)
          old='''\t\tcase <-ticker.C:
          \t\t\tfmt.Fprint(w, ": keepalive\\n\\n")
          \t\t\tflusher.Flush()
          '''
          new='''\t\tcase <-ticker.C:
          \t\t\tif a.identity != nil {
          \t\t\t\tif !a.identity.sessionIDActive(p.SessionID) { return }
          \t\t\t\ta.identity.touchSessionID(p.SessionID)
          \t\t\t}
          \t\t\tfmt.Fprint(w, ": keepalive\\n\\n")
          \t\t\tflusher.Flush()
          '''
          if 'sessionIDActive(p.SessionID)' not in s:
              if old not in s: raise SystemExit('SSE keepalive anchor missing')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          gofmt -w http_api.go identity_admin.go identity_presence.go http_admin_identity.go v18_2_test.go
          go test -count=1 -run '^TestV182' ./...
          go test -count=1 ./...
          go vet ./...
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add http_api.go identity_admin.go identity_presence.go http_admin_identity.go v18_2_test.go
            git commit -m 'v18.2 wire admin presence and session lifecycle'
            git push origin HEAD:v18.2-development
          fi
