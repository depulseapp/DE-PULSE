name: DE.PULSE v18.5 | One-shot Remaining Closure Evidence Discovery

on:
  push:
    branches: [v18.5-development]
    paths:
      - '.github/workflows/v18.5-closure-discovery-2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26.6'

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Enumerate remaining versioned tests
        shell: bash
        run: |
          set -euo pipefail
          go test -list '^TestV(173|175|180|181|182|183|184)' ./...
          echo '=== DECLARATIONS ==='
          grep -R -n -E '^func TestV(173|175|180|181|182|183|184)' --include='*_test.go' . || true
      - name: Find scenario evidence terms
        shell: bash
        run: |
          set -euo pipefail
          for term in fanout union shared reuse hysteresis recovery background duplicate degradation abstain unknown readiness operating limit supported limit packaged runtime diagnostics source disagreement; do
            echo "=== $term ==="
            grep -R -n -i -E "$term" --include='*_test.go' --include='*.js' --include='*.py' . | head -n 100 || true
          done
