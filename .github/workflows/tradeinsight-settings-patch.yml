name: Temporary TradeInsight Settings Patch

on:
  push:
    branches:
      - v18.9.2-tradeinsight-settings
    paths:
      - .github/workflows/tradeinsight-settings-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v18.9.2-tradeinsight-settings
          fetch-depth: 0
      - name: Apply governed source patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Canonical secret/public-state ownership.
          replace_once("app_model.go",
              '\tFinnhub      string `json:"finnhub"`\n',
              '\tFinnhub      string `json:"finnhub"`\n\tTradeInsight string `json:"tradeInsight,omitempty"`\n')
          replace_once("app_model.go",
              '\tHasFinnhubKey     bool `json:"hasFinnhubKey"`\n',
              '\tHasFinnhubKey      bool `json:"hasFinnhubKey"`\n\tHasTradeInsightKey bool `json:"hasTradeInsightKey"`\n')
          replace_once("app_state.go",
              '\t\tHasFinnhubKey:      strings.TrimSpace(a.secrets.Finnhub) != "",\n',
              '\t\tHasFinnhubKey:       strings.TrimSpace(a.secrets.Finnhub) != "",\n\t\tHasTradeInsightKey: strings.TrimSpace(a.secrets.TradeInsight) != "",\n')

          # Router configuration truth uses persisted credential with env fallback handled by TradeInsight resolver.
          replace_once("provider_router.go",
              '\tcase "tradeinsight":\n\t\treturn tradeInsightConfigured()\n',
              '\tcase "tradeinsight":\n\t\treturn tradeInsightConfigured(secrets.TradeInsight)\n')

          # Credential resolver: Settings first, canonical env second, legacy env compatibility third.
          replace_once("tradeinsight.go",
              '''func tradeInsightAPIKey() string {\n\tif key := strings.TrimSpace(os.Getenv("TIDATA_API_KEY")); key != "" {\n\t\treturn key\n\t}\n\treturn strings.TrimSpace(os.Getenv("TRADEINSIGHT_API_KEY"))\n}\n\nfunc tradeInsightConfigured() bool { return tradeInsightAPIKey() != "" }\n''',
              '''func tradeInsightAPIKey(configured ...string) string {\n\tif len(configured) > 0 {\n\t\tif key := strings.TrimSpace(configured[0]); key != "" {\n\t\t\treturn key\n\t\t}\n\t}\n\tif key := strings.TrimSpace(os.Getenv("TIDATA_API_KEY")); key != "" {\n\t\treturn key\n\t}\n\treturn strings.TrimSpace(os.Getenv("TRADEINSIGHT_API_KEY"))\n}\n\nfunc tradeInsightConfigured(configured ...string) bool { return tradeInsightAPIKey(configured...) != "" }\n''')
          replace_once("tradeinsight.go",
              '''func (e *Engine) tradeInsightFetchRows(ctx context.Context, path string, params url.Values) ([]map[string]any, error) {\n\tvar begin func() func(error)\n\tif e != nil && e.providerTelemetry != nil {\n\t\tbegin = func() func(error) { return e.providerTelemetry.begin(tradeInsightProviderName) }\n\t}\n\treturn tradeInsightFetchRowsAtObserved(ctx, &http.Client{Timeout: 18 * time.Second}, tradeInsightRESTBaseURL, tradeInsightAPIKey(), path, params, begin)\n}\n''',
              '''func (e *Engine) tradeInsightResolvedAPIKey() string {\n\tif e != nil && e.app != nil {\n\t\te.app.mu.RLock()\n\t\tconfigured := e.app.secrets.TradeInsight\n\t\te.app.mu.RUnlock()\n\t\treturn tradeInsightAPIKey(configured)\n\t}\n\treturn tradeInsightAPIKey()\n}\n\nfunc (e *Engine) tradeInsightConfigured() bool {\n\treturn e.tradeInsightResolvedAPIKey() != ""\n}\n\nfunc (e *Engine) tradeInsightFetchRows(ctx context.Context, path string, params url.Values) ([]map[string]any, error) {\n\tvar begin func() func(error)\n\tif e != nil && e.providerTelemetry != nil {\n\t\tbegin = func() func(error) { return e.providerTelemetry.begin(tradeInsightProviderName) }\n\t}\n\treturn tradeInsightFetchRowsAtObserved(ctx, &http.Client{Timeout: 18 * time.Second}, tradeInsightRESTBaseURL, e.tradeInsightResolvedAPIKey(), path, params, begin)\n}\n''')
          replace_once("tradeinsight.go",
              '\tif !tradeInsightConfigured() || !e.providerAllowed(tradeInsightProviderName) {\n',
              '\tif !e.tradeInsightConfigured() || !e.providerAllowed(tradeInsightProviderName) {\n')

          # Settings save / clear / provider-test reuse existing HTTP owners.
          replace_once("http_api.go",
              '\t\tFinnhubKey    string   `json:"finnhubKey"`\n\t\tAlpacaKey     string   `json:"alpacaKey"`\n',
              '\t\tFinnhubKey      string   `json:"finnhubKey"`\n\t\tTradeInsightKey string   `json:"tradeInsightKey"`\n\t\tAlpacaKey       string   `json:"alpacaKey"`\n')
          replace_once("http_api.go",
              '\tif v := cleanCredential(in.FinnhubKey); v != "" {\n\t\ta.secrets.Finnhub = v\n\t}\n\tif v := cleanCredential(in.AlpacaKey); v != "" {\n',
              '\tif v := cleanCredential(in.FinnhubKey); v != "" {\n\t\ta.secrets.Finnhub = v\n\t}\n\tif v := cleanCredential(in.TradeInsightKey); v != "" {\n\t\ta.secrets.TradeInsight = v\n\t}\n\tif v := cleanCredential(in.AlpacaKey); v != "" {\n')
          replace_once("http_api.go",
              '\tcase "finnhub":\n\t\ta.secrets.Finnhub = ""\n\tcase "alpaca":\n',
              '\tcase "finnhub":\n\t\ta.secrets.Finnhub = ""\n\tcase "tradeinsight":\n\t\ta.secrets.TradeInsight = ""\n\tcase "alpaca":\n')
          replace_once("http_api.go",
              '\t\tProvider      string `json:"provider"`\n\t\tFinnhubKey    string `json:"finnhubKey"`\n\t\tAlpacaKey     string `json:"alpacaKey"`\n',
              '\t\tProvider        string `json:"provider"`\n\t\tFinnhubKey      string `json:"finnhubKey"`\n\t\tTradeInsightKey string `json:"tradeInsightKey"`\n\t\tAlpacaKey       string `json:"alpacaKey"`\n')
          replace_once("http_api.go",
              '\tfk := a.secrets.Finnhub\n\tak := a.secrets.AlpacaKey\n',
              '\tfk := a.secrets.Finnhub\n\tti := a.secrets.TradeInsight\n\tak := a.secrets.AlpacaKey\n')
          replace_once("http_api.go",
              '\tif v := cleanCredential(in.FinnhubKey); v != "" {\n\t\tfk = v\n\t}\n\tif v := cleanCredential(in.AlpacaKey); v != "" {\n',
              '\tif v := cleanCredential(in.FinnhubKey); v != "" {\n\t\tfk = v\n\t}\n\tif v := cleanCredential(in.TradeInsightKey); v != "" {\n\t\tti = v\n\t}\n\tif v := cleanCredential(in.AlpacaKey); v != "" {\n')
          replace_once("http_api.go",
              '\tswitch provider {\n\tcase "alpaca":\n',
              '\tswitch provider {\n\tcase "tradeinsight":\n\t\tresult = testTradeInsight(ctx, ti)\n\tcase "alpaca":\n')
          replace_once("http_api.go",
              '''func testAlpaca(ctx context.Context, key, secret string) ProviderTestResult {\n''',
              '''func testTradeInsight(ctx context.Context, key string) ProviderTestResult {\n\tr := ProviderTestResult{Provider: "tradeinsight", CheckedAt: time.Now().UTC().Format(time.RFC3339)}\n\tkey = cleanCredential(key)\n\tif key == "" {\n\t\tr.Status = "missing"\n\t\tr.Message = "Enter a TradeInsight API key."\n\t\treturn r\n\t}\n\tend := time.Now().UTC()\n\tparams := url.Values{\n\t\t"ticker":        []string{"SPY"},\n\t\t"start":         []string{end.AddDate(0, 0, -10).Format("2006-01-02")},\n\t\t"end":           []string{end.AddDate(0, 0, 1).Format("2006-01-02")},\n\t\t"adjust_volume": []string{"true"},\n\t}\n\trows, err := tradeInsightFetchRowsAt(ctx, &http.Client{Timeout: 12 * time.Second}, tradeInsightRESTBaseURL, key, "/ohlc", params)\n\tif err != nil {\n\t\tr.Status = "failed"\n\t\tr.Message = err.Error()\n\t\treturn r\n\t}\n\tr.OK = true\n\tr.Status = "connected"\n\tr.Message = "TradeInsight historical-data access is working."\n\tr.Details = []string{fmt.Sprintf("%d SPY OHLC rows returned", len(rows)), "Shadow-first capability admission remains enforced"}\n\treturn r\n}\n\nfunc testAlpaca(ctx context.Context, key, secret string) ProviderTestResult {\n''')

          # Renderer: one normal provider card, same save/test/clear contract as existing providers.
          p = Path("renderer/renderer.js")
          text = p.read_text()
          anchor = '<article class="provider-card"><div class="provider-head"><div><h3>Alpaca · Preferred U.S. Equities & History</h3>'
          if text.count(anchor) != 1:
              raise SystemExit(f"renderer/renderer.js: Alpaca settings anchor count={text.count(anchor)}")
          trade_card = '''<article class="provider-card"><div class="provider-head"><div><h3>TradeInsight · Corporate & Market Intelligence</h3><span>${state.hasTradeInsightKey?'Saved securely':'API key needed'}</span></div><span>REST · Shadow-first</span></div><p class="field-help">Supplemental corporate and historical evidence routed through Smart Provider Router v2. Direct SEC/EDGAR remains authoritative for Form 4.</p><div class="field"><label>API Key</label><input id="tradeinsight-key" class="secret-input" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${state.hasTradeInsightKey?'Leave blank to keep saved key':'Paste TradeInsight key'}"></div><div class="button-row"><button class="btn" data-test-provider="tradeinsight">Save & Test</button><button class="btn ghost danger" data-clear-secret="tradeinsight">Clear</button></div>${providerStatus('tradeinsight')}</article>'''
          text = text.replace(anchor, trade_card + anchor, 1)
          old_body = "const body={settings:s,finnhubKey:$('#finnhub-key')?.value||'',alpacaKey:$('#alpaca-key')?.value||''"
          new_body = "const body={settings:s,finnhubKey:$('#finnhub-key')?.value||'',tradeInsightKey:$('#tradeinsight-key')?.value||'',alpacaKey:$('#alpaca-key')?.value||''"
          if text.count(old_body) != 1:
              raise SystemExit(f"renderer/renderer.js: settings body anchor count={text.count(old_body)}")
          text = text.replace(old_body, new_body, 1)
          old_test = "{provider:testProvider,finnhubKey:body.finnhubKey,alpacaKey:body.alpacaKey"
          new_test = "{provider:testProvider,finnhubKey:body.finnhubKey,tradeInsightKey:body.tradeInsightKey,alpacaKey:body.alpacaKey"
          if text.count(old_test) != 1:
              raise SystemExit(f"renderer/renderer.js: provider-test body anchor count={text.count(old_test)}")
          text = text.replace(old_test, new_test, 1)
          p.write_text(text)

          # Regression coverage for credential precedence, router truth, redaction and renderer wiring.
          Path("tradeinsight_settings_regression_test.go").write_text(r'''package main

import (
    "context"
    "encoding/json"
    "os"
    "path/filepath"
    "strings"
    "testing"
)

func TestTradeInsightAPIKeyPrecedenceAndEnvironmentFallback(t *testing.T) {
    t.Setenv("TIDATA_API_KEY", "env-primary")
    t.Setenv("TRADEINSIGHT_API_KEY", "env-legacy")
    if got := tradeInsightAPIKey("persisted-settings"); got != "persisted-settings" {
        t.Fatalf("persisted Settings key must take precedence, got %q", got)
    }
    if got := tradeInsightAPIKey(); got != "env-primary" {
        t.Fatalf("TIDATA_API_KEY must remain canonical env fallback, got %q", got)
    }
    t.Setenv("TIDATA_API_KEY", "")
    if got := tradeInsightAPIKey(); got != "env-legacy" {
        t.Fatalf("legacy TRADEINSIGHT_API_KEY compatibility fallback lost, got %q", got)
    }
}

func TestTradeInsightEngineResolverAndRouterUsePersistedSettings(t *testing.T) {
    t.Setenv("TIDATA_API_KEY", "env-primary")
    app := &Application{secrets: Secrets{TradeInsight: "persisted-settings"}}
    e := &Engine{app: app}
    if got := e.tradeInsightResolvedAPIKey(); got != "persisted-settings" {
        t.Fatalf("engine must resolve persisted key first, got %q", got)
    }
    if !e.tradeInsightConfigured() {
        t.Fatal("engine must report TradeInsight configured from persisted Settings")
    }
    if !e.providerConfigured("tradeinsight", app.secrets, Settings{}) {
        t.Fatal("Smart Provider Router v2 configuration truth must recognize persisted TradeInsight key")
    }
}

func TestTradeInsightPublicStateRedactsPersistedSecret(t *testing.T) {
    const secret = "tradeinsight-super-secret"
    app := &Application{state: defaultState(), secrets: Secrets{TradeInsight: secret}}
    public := app.publicStateLockedForUser(bootstrapOwnerID)
    if !public.HasTradeInsightKey {
        t.Fatal("public state must expose configured boolean")
    }
    payload, err := json.Marshal(public)
    if err != nil {
        t.Fatal(err)
    }
    if strings.Contains(string(payload), secret) {
        t.Fatal("TradeInsight secret leaked into public state")
    }
}

func TestTradeInsightProviderTestMissingKeyDoesNotCallNetwork(t *testing.T) {
    got := testTradeInsight(context.Background(), "")
    if got.OK || got.Status != "missing" || got.Provider != "tradeinsight" {
        t.Fatalf("unexpected missing-key result: %+v", got)
    }
}

func TestTradeInsightRendererSettingsWiring(t *testing.T) {
    raw, err := os.ReadFile(filepath.Join("renderer", "renderer.js"))
    if err != nil {
        t.Fatal(err)
    }
    src := string(raw)
    for _, needle := range []string{
        "tradeinsight-key",
        "state.hasTradeInsightKey",
        "data-test-provider=\"tradeinsight\"",
        "data-clear-secret=\"tradeinsight\"",
        "tradeInsightKey:$('#tradeinsight-key')",
        "tradeInsightKey:body.tradeInsightKey",
    } {
        if !strings.Contains(src, needle) {
            t.Fatalf("renderer missing TradeInsight Settings wiring %q", needle)
        }
    }
}
''')
          PY
          gofmt -w app_model.go app_state.go provider_router.go tradeinsight.go http_api.go tradeinsight_settings_regression_test.go
          git diff --check
          git status --short
      - name: Commit source batch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_model.go app_state.go provider_router.go tradeinsight.go http_api.go renderer/renderer.js tradeinsight_settings_regression_test.go
          git commit -m "feat: add TradeInsight settings credential UX"
          git push origin HEAD:v18.9.2-tradeinsight-settings
