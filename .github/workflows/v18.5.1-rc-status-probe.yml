name: DE.PULSE v18.5.1 | RC Certification Status Probe

on:
  push:
    branches: [v18.5.1-development]
    paths:
      - '.github/workflows/v18.5.1-rc-status-probe.yml'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  observe:
    name: Observe existing G11-G12 RC certification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v18.5.1-development
      - name: Publish exact-RC G12 status without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          cp=json.loads(pathlib.Path('release/v18.5.1/RELEASE_CHECKPOINT.json').read_text())
          rc=cp['rcSourceSha']; cid=cp['checkpointId']
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'depulse-v18.5.1-rc-probe'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}"
          def req(path,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              q=urllib.request.Request(base+path,data=data,method=method,headers=headers)
              with urllib.request.urlopen(q,timeout=30) as r:return json.loads(r.read().decode())
          runs=req('/actions/workflows/v18.5.1-rc-certification.yml/runs?branch=v18.5.1-development&event=push&per_page=20')['workflow_runs']
          if not runs: raise SystemExit('No RC certification run found')
          # The release checkpoint trigger is the newest matching run; the workflow itself validates exact G10/RC provenance.
          run=max(runs,key=lambda r:int(r['id'])); run_id=int(run['id']); url=run['html_url']
          def status(state,desc):
              req(f'/statuses/{rc}',method='POST',payload={'state':state,'context':'DE.PULSE/v18.5.1-G12','description':desc[:140],'target_url':url})
          if run.get('status')!='completed':
              status('pending',f'{cid}: G11-G12 {run.get("status")}')
              print(f'PENDING: run {run_id} status={run.get("status")}')
              raise SystemExit(0)
          jobs=req(f'/actions/runs/{run_id}/jobs?per_page=100')['jobs']; by={j['name']:j for j in jobs}
          required=['G11 · Immutable RC / G10 provenance','G11 · RC acceptance / adversarial / HTTP / deterministic / renderer / responsive','G12 · Full exhaustive certification']
          failed=[n for n in required if by.get(n,{}).get('conclusion')!='success']
          arts=req(f'/actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          g11=any(a['name']=='De-Pulse-v18.5.1-G11-RC-Certification' and not a['expired'] for a in arts)
          g12=any(a['name']=='De-Pulse-v18.5.1-G12-Full-Certification' and not a['expired'] for a in arts)
          if run.get('conclusion')=='success' and not failed and g11 and g12:
              status('success',f'{cid}: G11-G12 PASS on {rc[:12]}')
              print(f'PASS: run {run_id} exact RC {rc}')
          else:
              status('failure',f'{cid}: G11-G12 not green; inspect run')
              raise SystemExit('RC certification not green: '+','.join(failed)+f'; g11={g11}; g12={g12}; run={run.get("conclusion")}')
          PY
