name: DE.PULSE v18.5 | Source Quality Fix

on:
  push:
    branches: [v18.5-development]
    paths:
      - .github/workflows/v18.5-source-quality-fix.yml

permissions:
  contents: write

jobs:
  fix-comment-placement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v18.5-development
          fetch-depth: 1
      - name: Relocate provider reconciliation invariant comment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('provider_reconciliation.go')
          s = p.read_text()
          old = '''// buildProviderReconciliation compares valid contemporaneous provider observations
// without treating absence of a second source as agreement. Canonical provider choice
// follows the Provider Router priority so reconciliation cannot create a parallel owner.
func providerReconciliationConflictCount(rows []ProviderReconciliationDecision) int64 {'''
          new = '''// providerReconciliationConflictCount counts only explicit cross-provider conflicts;
// SINGLE SOURCE and STALE are intentionally not promoted into disagreement evidence.
func providerReconciliationConflictCount(rows []ProviderReconciliationDecision) int64 {'''
          if old not in s:
              raise SystemExit('expected misplaced reconciliation comment block not found')
          s = s.replace(old, new, 1)
          marker = '''func buildProviderReconciliation(router ProviderRouterSnapshot, observations map[string]map[string]Quote, canonical map[string]Quote, now int64) []ProviderReconciliationDecision {'''
          replacement = '''// buildProviderReconciliation compares valid contemporaneous provider observations
// without treating absence of a second source as agreement. Canonical provider choice
// follows Provider Router priority so reconciliation cannot create a parallel owner.
func buildProviderReconciliation(router ProviderRouterSnapshot, observations map[string]map[string]Quote, canonical map[string]Quote, now int64) []ProviderReconciliationDecision {'''
          if marker not in s:
              raise SystemExit('buildProviderReconciliation marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
          git diff --check
          git diff -- provider_reconciliation.go
      - name: Commit source-only fix and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v18.5-source-quality-fix.yml
          git config user.name "depulseapp"
          git config user.email "de.pulse.app@gmail.com"
          git add -- provider_reconciliation.go .github/workflows/v18.5-source-quality-fix.yml
          git diff --cached --check
          git commit -m "docs(v18.5): clarify provider reconciliation invariants"
          git push origin HEAD:v18.5-development
