name: DE.PULSE v18.4 Session Security Builder

on:
  push:
    branches: [v18.4-development]
    paths:
      - '.github/workflows/v18.4-session-security-builder.yml'
      - '.depulse-build/v18_4_session_security_apply.py'
      - '.depulse-build/v18_4_session_security_test.go.payload'

permissions:
  contents: write

concurrency:
  group: v18.4-session-security-builder
  cancel-in-progress: false

jobs:
  session-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Apply bounded session-security delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^)" = '673fcd3b60d06eafb8e91244d0cdbbe88c001c4a'
          python3 .depulse-build/v18_4_session_security_apply.py
          gofmt -w identity_model.go v18_4_session_security_test.go
      - name: Qualify session-security delta
        run: |
          set -euo pipefail
          python3 source_health_architecture_gate.py
          python3 v18_4_scope_gate.py
          go test -count=1 -run '^TestV184' ./...
          go test -count=1 ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/depulse-v184-session-windows.test .
      - name: Publish qualified session-security delta
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- identity_model.go v18_4_session_security_test.go
          git commit -m 'v18.4: preserve authentication age and absolute session lifetime'
          git push origin HEAD:v18.4-development
