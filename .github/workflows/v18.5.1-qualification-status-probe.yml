name: DE.PULSE v18.5.1 | Qualification Status Probe

on:
  push:
    branches: [v18.5.1-development]
    paths:
      - '.github/workflows/v18.5.1-qualification-status-probe.yml'

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: v18.5.1-qualification-status-probe
  cancel-in-progress: true

jobs:
  observe:
    name: Observe exact Checkpoint G10 without re-running qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v18.5.1-development
          fetch-depth: 2
      - name: Publish exact-source G10 status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          QUALIFICATION_TRIGGER_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, urllib.error

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          trigger_sha = os.environ['QUALIFICATION_TRIGGER_SHA']
          checkpoint = json.loads(pathlib.Path('release/v18.5.1/QUALIFICATION_CHECKPOINT.json').read_text())
          source_sha = str(checkpoint['sourceSha'])
          checkpoint_id = str(checkpoint['checkpointId'])
          base = f'https://api.github.com/repos/{repo}'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'depulse-v18.5.1-status-probe',
          }

          def request(path, method='GET', payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          runs = request('/actions/workflows/v18.5.1-recovery-ci.yml/runs?branch=v18.5.1-development&event=push&per_page=20')['workflow_runs']
          matches = [r for r in runs if r.get('head_sha') == trigger_sha]
          if not matches:
              raise SystemExit(f'No qualification run found for trigger {trigger_sha}')
          run = max(matches, key=lambda r: int(r['id']))
          run_id = int(run['id'])
          run_url = run['html_url']

          def publish(state, description):
              payload = {
                  'state': state,
                  'context': 'DE.PULSE/v18.5.1-G10',
                  'description': description[:140],
                  'target_url': run_url,
              }
              request(f'/statuses/{source_sha}', method='POST', payload=payload)

          if run.get('status') != 'completed':
              publish('pending', f'{checkpoint_id}: qualification still {run.get("status")}')
              raise SystemExit(f'Qualification run {run_id} is still {run.get("status")}')

          jobs = request(f'/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          by_name = {j['name']: j for j in jobs}
          required = [
              'G6 · Integration & MEDIUM · PostgreSQL / continuity',
              'G7 · Data, Security & Adaptive Intelligence',
              'G8 · Performance, Capacity & Stability',
              'G9 · Cross-Module / UI / UX',
              'G10 · Immutable qualification evidence',
          ]
          missing = [name for name in required if name not in by_name]
          failed = [name for name in required if name in by_name and by_name[name].get('conclusion') != 'success']
          artifacts = request(f'/actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          g10_artifact = any(a.get('name') == 'De-Pulse-v18.5.1-G10-PASS' and not a.get('expired') for a in artifacts)

          if run.get('conclusion') == 'success' and not missing and not failed and g10_artifact:
              publish('success', f'{checkpoint_id}: G0-G10 PASS on {source_sha[:12]}')
              print(f'PASS: run {run_id} · {checkpoint_id} · source {source_sha} · G10 artifact present')
          else:
              details = []
              if run.get('conclusion') != 'success': details.append(f'run={run.get("conclusion")}')
              if missing: details.append('missing=' + ','.join(missing))
              if failed: details.append('failed=' + ','.join(failed))
              if not g10_artifact: details.append('G10-artifact=missing')
              publish('failure', f'{checkpoint_id}: G10 not green; inspect qualification run')
              raise SystemExit('Qualification not green: ' + '; '.join(details))
          PY
