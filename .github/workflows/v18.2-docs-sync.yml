name: DE.PULSE v18.2 Documentation Sync

on:
  push:
    branches: [v18.2-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18.2-docs-sync
  cancel-in-progress: true

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'v18.2 align current documentation')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Align current docs with v18.2 TEST identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('README.md'); s=p.read_text()
          marker='## Previous Stable — v18.0.6 STABLE — Smart Provider Router + Rapid Move / Market Shock Hardening'
          tail=s[s.index(marker):] if marker in s else s
          head='''# DE.PULSE v18.2.0 TEST — Admin / Presence / Sessions

**Build:** `v18.2.0-test-admin-presence-sessions-20260814`  
**Channel:** TEST  
**Current Stable baseline:** v18.1.0  
**Major v18 provenance anchor:** v17.5.1  
**Patch predecessor:** v18.1.0 STABLE  
**Application bundle:** `De-Pulse-v18.2.0-TEST.app`  
**Runtime/config:** `PersonalMarketTerminal-v18.2.0-TEST`

v18.2.0 extends the canonical `IdentityService` with role-aware user lifecycle operations, redacted user/session operational views, ACTIVE / IDLE / OFFLINE presence derived from persisted session truth, password-reset and session-revocation lifecycle, SSE revocation enforcement, and a compact privileged Settings administration surface. USER/DEMO do not see administration controls.

v18.1 per-user market-state ownership and the shared fetch-once/calculate-once intelligence core remain unchanged. Provider configuration, canonical market evidence, Router/Rapid Move, Opportunity Radar and deterministic scoring remain shared operational intelligence. True hosted PostgreSQL/browser architecture remains v18.3. Protected deterministic Day/Swing/Long formulas and the permanent **No Execution Boundary** remain unchanged.

## Immediate Stable predecessor — v18.1.0 STABLE — Multi-User / My Market Symbols

**Build:** `v18.1.0-stable-multi-user-my-market-symbols-20260814`  
**Channel:** STABLE  
**Current Stable baseline:** v18.1.0  
**Major v18 provenance anchor:** v17.5.1  
**Application bundle:** `De-Pulse.app`  
**Runtime/config:** `PersonalMarketTerminal`

v18.1.0 is the certified incoming Stable baseline for this TEST build. It provides durable per-user market workspaces while preserving one shared canonical market-data and intelligence core.

'''
          p.write_text(head+tail)

          sections={
          'renderer/docs/user.md':'''## v18.2.0 TEST — Administration, Presence & Sessions

Privileged OWNER/ADMIN-class users now have a compact Settings administration surface for creating lower-authority accounts, changing permitted roles/status, resetting temporary passwords, viewing ACTIVE / IDLE / OFFLINE presence and revoking eligible sessions. Presence comes from authenticated session truth; there is no separate heartbeat database. Credential hashes and opaque session tokens are never shown.

Role and lifecycle changes revoke affected sessions, and a revoked/expired long-lived SSE connection closes on its next keepalive. USER/DEMO do not see administration controls. v18.1 personal market workspaces remain isolated, while provider/evidence/scoring intelligence remains shared and efficient. Hosted PostgreSQL/browser deployment remains v18.3. The **No Execution** boundary is unchanged.

''',
          'renderer/docs/developer.md':'''## v18.2.0 TEST — Admin / presence / session architecture

v18.2 extends the existing `IdentityService`; it does not introduce a second user/session/presence store. `AdminUserView` / `AdminSessionView` expose only operational fields, while password hashes, token hashes and opaque tokens remain server-side. Role hierarchy and active-owner safety are centralized in the identity owner. Role/status/password changes revoke affected sessions.

Presence is derived from persisted `SessionRecord.LastSeenAt`, idle/absolute expiry and revocation. SSE keepalive revalidates the same canonical session and touches `LastSeenAt`; revoked or expired streams terminate. The modular Settings admin UI is role-gated to SUPER_OWNER / OWNER / ADMIN and uses existing CSRF protection for mutations. v18.1 `UserWorkspace` remains the personal-market-state owner, and shared provider/evidence/Router/Rapid Move/deterministic scoring pipelines remain unchanged. PostgreSQL/hosted web stays v18.3.

''',
          'renderer/docs/limitations.md':'''## v18.2.0 TEST — administration / presence boundaries

v18.2 adds local/shared-process administrative user and session operations but is **not yet the true hosted multi-user deployment**. Presence reflects authenticated session activity as ACTIVE / IDLE / OFFLINE; it is operational presence, not device identity, geolocation or guaranteed human attention. Session history is bounded operational context.

Administrators can manage only roles below their authority; own-account destructive changes and elimination of the final active OWNER/SUPER_OWNER are blocked. Temporary-password creation/reset requires the user to replace the password on sign-in and revokes prior sessions. Hosted PostgreSQL, browser-scale concurrency, backup/restore and shared-server recovery remain v18.3. Broader commercial/data-rights/security hardening remains v18.4. The **No Execution** boundary is unchanged.

'''}
          for name,section in sections.items():
              p=Path(name); s=p.read_text(); first=s.find('\n\n')
              if '## v18.2.0 TEST' not in s:
                  s=s[:first+2]+section+s[first+2:]
              p.write_text(s)
          PY
          python3 version_consistency_test.py
          python3 documentation_governance_gate.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md renderer/docs/user.md renderer/docs/developer.md renderer/docs/limitations.md
          git commit -m 'v18.2 align current documentation'
          git push origin HEAD:v18.2-development
