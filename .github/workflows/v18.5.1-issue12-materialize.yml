name: DE.PULSE v18.5.1 | Issue 12 Materializer

on:
  push:
    branches:
      - v18.5.1-development
    paths:
      - .github/workflows/v18.5.1-issue12-materialize.yml
      - release/v18.5.1/apply_issue12_fix.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18-5-1-issue12-materializer
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize Issue 12 product source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current recovery branch
        uses: actions/checkout@v4
        with:
          ref: v18.5.1-development
          fetch-depth: 0

      - name: Apply deterministic Issue 12 source transformation
        run: python3 release/v18.5.1/apply_issue12_fix.py

      - name: Cheap source validation
        run: |
          node --check renderer/renderer.js
          python3 -m py_compile release/v18.5.1/apply_issue12_fix.py release/v18.5.1/browser_watchlist_membership_test.py
          git diff --check

      - name: Commit materialized product source
        shell: bash
        run: |
          if git diff --quiet -- renderer/renderer.js renderer/styles.css; then
            echo "Issue 12 source is already materialized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add renderer/renderer.js renderer/styles.css
          git commit -m "fix: correct global watchlist removal and current desk semantics"
          git push origin HEAD:v18.5.1-development
