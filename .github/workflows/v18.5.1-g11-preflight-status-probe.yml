name: DE.PULSE v18.5.1 | G11 Preflight Status Probe

on:
  push:
    branches: [v18.5.1-development]
    paths:
      - '.github/workflows/v18.5.1-g11-preflight-status-probe.yml'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Observe existing preflight without rerunning tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: cd4fb2c0e0dbb28e2f4a501fee5829f1f94b9c74
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          h={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'depulse-g11-preflight-probe'}
          base=f"https://api.github.com/repos/{os.environ['REPO']}"
          def req(path,method='GET',payload=None):
              data=None if payload is None else json.dumps(payload).encode(); q=urllib.request.Request(base+path,data=data,method=method,headers=h)
              with urllib.request.urlopen(q,timeout=30) as r:return json.loads(r.read().decode())
          runs=req('/actions/workflows/v18.5.1-renderer-rc-diagnostic.yml/runs?branch=v18.5.1-development&event=push&per_page=10')['workflow_runs']
          run=max(runs,key=lambda r:int(r['id'])); url=run['html_url']
          if run['status']!='completed':
              state='pending'; desc=f"G11 remaining preflight {run['status']}"
          elif run['conclusion']=='success':
              state='success'; desc='G11 remaining preflight PASS'
          else:
              state='failure'; desc=f"G11 remaining preflight {run['conclusion']}"
          req(f"/statuses/{os.environ['SOURCE_SHA']}",'POST',{'state':state,'context':'DE.PULSE/v18.5.1-G11-preflight','description':desc,'target_url':url})
          print(run['id'],run['status'],run.get('conclusion'))
          PY
