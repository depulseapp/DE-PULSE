name: DE.PULSE v18.3 One-Shot Candidate Builder

on:
  push:
    branches: [v18.3-development]
    paths:
      - '.depulse-build/v18.3/**'
      - '.github/workflows/v18.3-candidate-builder.yml'

permissions:
  contents: write

concurrency:
  group: v18.3-candidate-builder
  cancel-in-progress: false

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Verify staging lineage and reconstruct candidate patch
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE='cbbdf2bdc1619146ee0a52c99a9d0e43cdbd1fcc'
          EXPECTED_GZIP='ed83ee49ea8290089441b513c8bbbf847d031dc3f10bc092ca8b67a5d020d809'
          EXPECTED_PATCH='55020d99206d4bcaf6a46859867524c8cdef2afff72842c691d7795f12ffe704'
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          while IFS= read -r f; do
            case "$f" in
              .depulse-build/v18.3/*|.github/workflows/v18.3-candidate-builder.yml) ;;
              *) echo "unexpected pre-candidate staging path: $f" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only "$EXPECTED_BASE" HEAD)
          cat .depulse-build/v18.3/v3/chunk*.b64 | base64 -d > /tmp/v18.3-candidate.patch.gz
          echo "$EXPECTED_GZIP  /tmp/v18.3-candidate.patch.gz" | sha256sum -c -
          gzip -dc /tmp/v18.3-candidate.patch.gz > /tmp/v18.3-candidate.patch
          echo "$EXPECTED_PATCH  /tmp/v18.3-candidate.patch" | sha256sum -c -
          git apply --check /tmp/v18.3-candidate.patch
          git apply /tmp/v18.3-candidate.patch
      - name: Canonicalize dependency lock and Go source
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          grep -q '^go 1\.23' go.mod
          grep -q 'github.com/jackc/pgx/v5 v5.7.6' go.mod
          gofmt -w app_bootstrap.go http_api.go main.go persistence_backend_fallback.go persistence_backend_postgres.go persistence_backend_postgres_stub.go persistence_backend_select.go persistence_backend_sqlite.go persistence_backend_windows.go persistence_repository.go runtime_environment.go v18_3_foundation_test.go v18_3_postgres_test.go v18_test_profile.go
      - name: Bound product candidate delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
            '.github/workflows/v18.3-dev-ci.yml','README.md','VERSION.txt','app_bootstrap.go','certification_plan.json','ci_pipeline_plan.json','go.mod','go.sum','http_api.go','main.go','persistence_backend_fallback.go','persistence_backend_postgres.go','persistence_backend_postgres_stub.go','persistence_backend_select.go','persistence_backend_sqlite.go','persistence_backend_windows.go','persistence_repository.go','prefreeze_qualification.py','release/v18.3.0/G0-EXACT-BASELINE.md','release/v18.3.0/G1-IMMUTABLE-SCOPE.md','release/v18.3.0/G2-ARCHITECTURE-DATA-UTILITY.md','release/v18.3.0/G3-DESIGN-DEPENDENCY-READINESS.md','release_identity.json','renderer/docs/developer.md','renderer/docs/limitations.md','renderer/docs/user.md','renderer/index.html','renderer/renderer.js','runtime_environment.go','v18_3_foundation_test.go','v18_3_g0_g3_contract.json','v18_3_postgres_test.go','v18_3_principal_engineer_gate.py','v18_3_scope.json','v18_3_scope_gate.py','v18_test_profile.go'
          }
          lines = subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'], text=True).splitlines()
          paths = {line[3:] for line in lines}
          if paths != expected:
              print('missing', sorted(expected-paths))
              print('extra', sorted(paths-expected))
              raise SystemExit(1)
          print(f'bounded product candidate paths: {len(paths)}')
          PY
      - name: G0-G3 and focused qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 release_identity.py --verify
          python3 v18_3_scope_gate.py
          python3 v18_3_principal_engineer_gate.py
          go test -count=1 -run '^TestV183' ./...
          go test -count=1 ./...
          go vet ./...
          go test -tags postgres -run '^$' ./...
          go vet -tags postgres ./...
      - name: Remove staging assets and publish canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .github/workflows/v18.3-dev-ci.yml README.md VERSION.txt app_bootstrap.go certification_plan.json ci_pipeline_plan.json go.mod go.sum http_api.go main.go persistence_backend_fallback.go persistence_backend_postgres.go persistence_backend_postgres_stub.go persistence_backend_select.go persistence_backend_sqlite.go persistence_backend_windows.go persistence_repository.go prefreeze_qualification.py release/v18.3.0/G0-EXACT-BASELINE.md release/v18.3.0/G1-IMMUTABLE-SCOPE.md release/v18.3.0/G2-ARCHITECTURE-DATA-UTILITY.md release/v18.3.0/G3-DESIGN-DEPENDENCY-READINESS.md release_identity.json renderer/docs/developer.md renderer/docs/limitations.md renderer/docs/user.md renderer/index.html renderer/renderer.js runtime_environment.go v18_3_foundation_test.go v18_3_g0_g3_contract.json v18_3_postgres_test.go v18_3_principal_engineer_gate.py v18_3_scope.json v18_3_scope_gate.py v18_test_profile.go
          git rm -r -- .depulse-build/v18.3 .github/workflows/v18.3-candidate-builder.yml
          test -z "$(git status --porcelain --untracked-files=all | grep '^??' || true)"
          python3 source_fingerprint.py | tee /tmp/v18.3-source-fingerprint.txt
          git commit -m 'v18.3: PostgreSQL hosted shared-state foundation'
          git push origin HEAD:v18.3-development
