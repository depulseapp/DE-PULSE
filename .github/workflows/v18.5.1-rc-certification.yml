name: DE.PULSE v18.5.1 | Immutable RC Certification

on:
  push:
    branches: [v18.5.1-development]
    paths:
      - 'release/v18.5.1/RELEASE_CHECKPOINT.json'

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: v18.5.1-rc-certification
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.6'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  g11-freeze:
    name: G11 · Immutable RC / G10 provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rc_sha: ${{ steps.contract.outputs.rc_sha }}
      checkpoint_id: ${{ steps.contract.outputs.checkpoint_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v18.5.1-development
          fetch-depth: 0
      - id: contract
        name: Validate release checkpoint and G10 provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          cp=json.loads(pathlib.Path('release/v18.5.1/RELEASE_CHECKPOINT.json').read_text())
          if cp.get('release')!='v18.5.1' or cp.get('releaseCertificationRequested') is not True:
              raise SystemExit('release checkpoint is not an authorized v18.5.1 certification request')
          rc=str(cp.get('rcSourceSha','')).strip(); cid=str(cp.get('checkpointId','')).strip()
          run_id=int(cp.get('g10RunId',0)); artifact_id=int(cp.get('g10ArtifactId',0))
          if len(rc)!=40 or not cid or not run_id or not artifact_id: raise SystemExit('release checkpoint missing exact RC/G10 binding')
          subprocess.run(['git','cat-file','-e',f'{rc}^{{commit}}'],check=True)
          subprocess.run(['git','merge-base','--is-ancestor','0d37ca35f5fc3ad89cebed506cc5a4c2d6a7a680',rc],check=True)
          # Immutable RC branch must resolve to the exact qualified source.
          got=subprocess.check_output(['git','rev-parse','origin/v18.5.1-rc-g10']).decode().strip()
          if got!=rc: raise SystemExit(f'RC branch moved: {got} != {rc}')
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'depulse-v18.5.1-rc'}
          def get(path):
              req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}"+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
          run=get(f'/actions/runs/{run_id}')
          if run.get('conclusion')!='success': raise SystemExit('recorded G10 workflow is not successful')
          jobs=get(f'/actions/runs/{run_id}/jobs?per_page=100')['jobs']; by={j['name']:j for j in jobs}
          for name in ['G6 · Integration & MEDIUM · PostgreSQL / continuity','G7 · Data, Security & Adaptive Intelligence','G8 · Performance, Capacity & Stability','G9 · Cross-Module / UI / UX','G10 · Immutable qualification evidence']:
              if by.get(name,{}).get('conclusion')!='success': raise SystemExit(f'G10 provenance missing green job: {name}')
          arts=get(f'/actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          art=[a for a in arts if int(a['id'])==artifact_id and a['name']=='De-Pulse-v18.5.1-G10-PASS' and not a['expired']]
          if not art: raise SystemExit('recorded G10 artifact missing/expired')
          out=pathlib.Path(os.environ['GITHUB_OUTPUT']); out.write_text(f'rc_sha={rc}\ncheckpoint_id={cid}\n')
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/v18.5.1-G11-RC-FREEZE.json').write_text(json.dumps({'release':'v18.5.1','gate':'G11','status':'PASS','rcSourceSha':rc,'rcBranch':'v18.5.1-rc-g10','checkpointId':cid,'g10RunId':run_id,'g10ArtifactId':artifact_id,'g10ArtifactDigest':art[0].get('digest')},indent=2)+'\n')
          print(f'G11 RC freeze PASS: {rc}')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G11-RC-Freeze
          path: evidence/v18.5.1-G11-RC-FREEZE.json
          if-no-files-found: error
          retention-days: 365

  g11-certification:
    name: G11 · RC acceptance / adversarial / HTTP / deterministic / renderer / responsive
    needs: [g11-freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g11-freeze.outputs.rc_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Execute canonical G11 plan against immutable RC
        env:
          DEPULSE_CERT_DIR: ${{ runner.temp }}/depulse-v18.5.1-g11
        run: |
          python3 certification_runner.py --phase G11 --fail-fast
          mkdir -p evidence/g11
          cp "$DEPULSE_CERT_DIR/summary.json" evidence/g11/G11-RC-CERTIFICATION.json
          cp -R "$DEPULSE_CERT_DIR/logs" evidence/g11/logs
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G11-RC-Certification
          path: evidence/g11
          if-no-files-found: error
          retention-days: 365

  g12-full:
    name: G12 · Full exhaustive certification
    needs: [g11-freeze, g11-certification]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.g11-freeze.outputs.rc_sha }}
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Execute canonical G12 full/race/randomized/extreme plan
        env:
          DEPULSE_CERT_DIR: ${{ runner.temp }}/depulse-v18.5.1-g12
        run: |
          python3 certification_runner.py --phase G12
          mkdir -p evidence/g12
          cp "$DEPULSE_CERT_DIR/summary.json" evidence/g12/G12-RC-FULL-CERTIFICATION.json
          cp -R "$DEPULSE_CERT_DIR/logs" evidence/g12/logs
      - name: Publish G12 exact-source status
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RC_SHA: ${{ needs.g11-freeze.outputs.rc_sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          p={'state':'success','context':'DE.PULSE/v18.5.1-G12','description':'Immutable RC full certification PASS','target_url':f"https://github.com/{os.environ['REPO']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['RC_SHA']}",data=json.dumps(p).encode(),method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'depulse-v18.5.1-g12'})
          urllib.request.urlopen(req,timeout=30).read()
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.1-G12-Full-Certification
          path: evidence/g12
          if-no-files-found: error
          retention-days: 365
