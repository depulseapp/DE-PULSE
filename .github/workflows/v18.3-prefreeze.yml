name: DE.PULSE v18.3 | G9-G10 | Pre-Freeze Qualification

on:
  push:
    branches: [v18.3-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.3-prefreeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: G9-G10 · Candidate · Pre-Freeze Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Rebind G0-G4 · Identity, Scope, Architecture & Governance
        run: |
          set -euo pipefail
          python3 release_identity.py --verify
          python3 version_consistency_test.py
          python3 canonical_naming_gate.py
          python3 adaptive_resume_gate.py
          python3 v18_3_scope_gate.py
          python3 v18_3_principal_engineer_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 functionality_utility_checkpoint_gate.py
          python3 data_health_policy_gate.py
          python3 documentation_governance_gate.py
          test "$(git merge-base HEAD 78c42d739bff64b0e4c8676cb341fee65c4a3e67)" = "78c42d739bff64b0e4c8676cb341fee65c4a3e67"
      - name: Reconcile G5-G6 · Focused, inherited and full Go qualification
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestV183' ./...
          go test -count=1 -run '^TestV182' ./...
          go test -count=1 -run '^TestV181' ./...
          go test -count=1 -run '^TestV1806' ./...
          go test -count=1 ./...
          go vet ./...
      - name: G6 · Persistence fallback + Windows x64 compile
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go test -count=1 ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/De-Pulse-v18.3.0-TEST.exe .
      - name: G9 · Renderer · Deterministic acceptance
        run: |
          set -euo pipefail
          node renderer_logic_test.js
          node v18_0_5_renderer_test.js
          node v18_2_renderer_test.js
          node deterministic_equivalence_test.js
          node trader_acceptance_test.js
      - name: G9 · Browser · Provision responsive runtime
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium
          P="$(python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p: print(p.chromium.executable_path)
          PY
          )"
          test -x "$P"
          sudo ln -sf "$P" /usr/bin/chromium
      - name: G9 · HTTP and responsive qualification
        run: |
          set -euo pipefail
          python3 http_workflow_test.py
          python3 responsive_ui_sharded_gate.py
      - name: G10 · Randomized and Extreme 30 qualification
        run: |
          set -euo pipefail
          python3 randomized_order_gate.py
          python3 extreme_30_gate.py
      - name: G10 · Freeze candidate fingerprint and evidence
        run: |
          set -euo pipefail
          FP="$(python3 ci_pipeline.py --fingerprint)"
          printf '%s\n' "$FP" | tee v18.3-G10-source-fingerprint.txt
          python3 - "$FP" > v18.3-G10-PASS.json <<'PY'
          import json,sys,datetime
          print(json.dumps({
            'schemaVersion':1,
            'gateRange':'G0-G10',
            'status':'PASS',
            'release':'v18.3.0 TEST',
            'sourceFingerprint':sys.argv[1],
            'incomingStable':'v18.2.0',
            'checks':{
              'identity':True,'scope':True,'architecture':True,'sourceHealth':True,'dataUtility':True,'dataHealth':True,
              'focusedV183':True,'v182Regression':True,'v181Regression':True,'routerRapidMoveRegression':True,
              'fullGo':True,'vet':True,'cgoFallback':True,'windowsCompile':True,
              'renderer':True,'deterministic':True,'trader':True,'http':True,'responsive':True,
              'randomized':True,'extreme30':True
            },
            'g6ToG8PostgresEvidence':'required from same-head v18.3 Development Qualification run',
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          },indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.3.0-TEST-G10-Pre-Freeze-Evidence
          path: |
            v18.3-G10-source-fingerprint.txt
            v18.3-G10-PASS.json
          retention-days: 90
