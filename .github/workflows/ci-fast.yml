name: DE.PULSE | CI Fast

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depulse-ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  fast:
    name: Fast impact-safe preflight
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: impact
        name: Deterministic impact plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/impact_plan.py --base "${BASE_SHA:-}" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --json-out ci-impact-plan.json
      - name: Canonical workflow policy
        run: python3 tools/ci/workflow_policy.py
      - name: Recursive source-health / package discovery
        run: python3 tools/ci/source_health_architecture_gate.py
      - name: Repository migration safety
        run: python3 tools/ci/repository_migration_gate.py
      - name: Retired pre-v17 test/gate equivalence
        run: python3 tools/ci/retired_test_equivalence_gate.py
      - name: Active work-slice executable closure ledger
        run: python3 tools/ci/work_slice_closure_gate.py
      - name: Conserved v17/v18 requirement-ledger integrity
        run: python3 tools/ci/implementation_reconciliation_gate.py
      - name: Watchlist membership regression contract
        run: python3 tools/ci/watchlist_membership_contract.py
      - name: Adaptive resume portability contract
        run: python3 tools/ci/adaptive_resume_gate.py
      - name: Post-Stable continuity contract
        run: python3 tools/ci/post_stable_continuity_gate.py
      - name: Platform-neutral source provenance regression
        run: python3 tools/ci/source_provenance_test.py
      - name: Release identity
        run: python3 tools/release/release_identity.py --verify
      - name: Python syntax
        run: python3 -m compileall -q tools/ci tools/release tools/release/source_fingerprint.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Go formatting
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file" || true
            done <<< "$bad"
            exit 1
          fi
      - name: Go vet
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        run: go vet ./...
      - name: Go full unit/package suite
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        run: go test -count=1 ./...
      - name: Renderer JavaScript syntax
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find renderer -type f -name '*.js' -print0)
      - name: Surface consolidation regression
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        run: node tests/renderer/surface_consolidation_test.js
      - name: Role-aware documentation regression
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        run: node tests/renderer/documentation_access_test.js
      - name: Record exact-head Fast status
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f context='DE.PULSE/fast-head' \
            -f description='CI Fast passed exact source head' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: CI summary
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '## DE.PULSE CI Fast'
            echo "- exact source SHA: $HEAD_SHA"
            echo "- process-only: ${{ steps.impact.outputs.process_only }}"
            echo "- Go lane required: ${{ steps.impact.outputs.go_required }}"
            echo "- Node/renderer syntax required: ${{ steps.impact.outputs.node_required }}"
            echo '- release-state/coherence + governance checks complete before Go/Node setup'
            echo '- workflow policy: PASS'
            echo '- recursive source-health/package discovery: PASS'
            echo '- repository migration safety: PASS'
            echo '- retired pre-v17 test/gate equivalence: PASS'
            echo '- active work-slice closure-ledger enforcement: PASS'
            echo '- conserved v17/v18 ledger integrity: PASS'
            echo '- adaptive resume portability: PASS'
            echo '- post-Stable continuity: PASS'
            echo '- Git-object provenance: PASS'
            echo '- exact-head status: DE.PULSE/fast-head'
            echo '- release dispatch: NOT PERMITTED from CI Fast'
          } >> "$GITHUB_STEP_SUMMARY"

  main-continuity:
    name: Post-Stable continuity sentinel
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Detect unreconciled post-Stable repository state
        run: python3 tools/ci/post_stable_continuity_gate.py
      - name: Validate aligned Stable evidence when present
        run: python3 tools/ci/stable_evidence_gate.py

  branch-hygiene:
    name: Remove merged and obsolete branches
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Apply conservative branch hygiene
        run: python3 tools/ci/branch_hygiene.py --apply --json-out branch-hygiene.json
      - name: Retain cleanup report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DE-PULSE-branch-hygiene-${{ github.sha }}
          path: branch-hygiene.json
          if-no-files-found: error
          retention-days: 7
