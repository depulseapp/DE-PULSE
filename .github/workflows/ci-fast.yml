name: DE.PULSE | CI Fast

on:
  pull_request:
  push:
    branches:
      - main
      - 'v*-development'
      - 'v*-release-certification'
      - 'v*-stable-promotion'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depulse-ci-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  fast:
    name: Fast impact-safe preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      process_only: ${{ steps.impact.outputs.process_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: impact
        name: Deterministic impact plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci/impact_plan.py --base "${BASE_SHA:-}" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT" --json-out ci-impact-plan.json
      - uses: actions/setup-go@v7
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v6
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Canonical workflow policy
        run: python3 tools/ci/workflow_policy.py
      - name: Watchlist membership regression contract
        run: python3 tools/ci/watchlist_membership_contract.py
      - name: Adaptive resume portability contract
        run: python3 adaptive_resume_gate.py
      - name: Platform-neutral source provenance regression
        run: python3 tools/ci/source_provenance_test.py
      - name: Release identity
        run: python3 release_identity.py --verify
      - name: Python syntax
        run: python3 -m compileall -q tools/ci tools/release adaptive_resume_gate.py source_fingerprint.py
      - name: Go formatting
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file" || true
            done <<< "$bad"
            exit 1
          fi
      - name: Go vet
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        run: go vet ./...
      - name: Go full unit/package suite
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        run: go test -count=1 ./...
      - name: Renderer JavaScript syntax
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find renderer -type f -name '*.js' -print0)
      - name: v18.6 surface consolidation regression
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        run: node v18_6_surface_consolidation_test.js
      - name: v18.6 role-aware documentation regression
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        run: node v18_6_documentation_access_test.js
      - name: CI summary
        shell: bash
        run: |
          {
            echo '## DE.PULSE CI Fast'
            echo "- SHA: $GITHUB_SHA"
            echo "- process-only: ${{ steps.impact.outputs.process_only }}"
            echo "- Go lane required: ${{ steps.impact.outputs.go_required }}"
            echo "- Node/renderer syntax required: ${{ steps.impact.outputs.node_required }}"
            echo '- workflow policy: PASS'
            echo '- watchlist membership contract: PASS'
            echo '- v18.6 surface consolidation contract: PASS when renderer lane is selected'
            echo '- v18.6 role-aware documentation contract: PASS when renderer lane is selected'
            echo '- adaptive resume portability: PASS'
            echo '- Git-object provenance: PASS'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain impact plan
        uses: actions/upload-artifact@v7
        with:
          name: DE-PULSE-ci-impact-${{ github.sha }}
          path: ci-impact-plan.json
          if-no-files-found: error
          retention-days: 7

  release-dispatch:
    name: Dispatch canonical release / promotion workflow
    needs: fast
    if: ${{ (github.event_name == 'push' && (endsWith(github.ref, '-release-certification') || (endsWith(github.ref, '-stable-promotion') && (github.actor == github.repository_owner || github.event.sender.login == github.repository_owner)))) || (github.event_name == 'pull_request' && (endsWith(github.event.pull_request.base.ref, '-release-certification') || endsWith(github.event.pull_request.base.ref, '-stable-promotion')) && github.actor == github.repository_owner && needs.fast.outputs.process_only == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: release
        name: Resolve immutable release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          python3 release_identity.py --verify
          version="$(python3 -c 'import json; print(json.load(open("release_identity.json"))["version"])')"
          build_id="$(python3 -c 'import json; print(json.load(open("release_identity.json"))["build_id"])')"
          release_line="${version%.*}"
          script="release/v${version}/run_full_certification.sh"
          test -f "$script"
          case "$GITHUB_EVENT_NAME" in
            push)
              release_ref="$GITHUB_REF_NAME"
              candidate_sha="$GITHUB_SHA"
              ;;
            pull_request)
              test "$PR_ACTOR" = "$REPO_OWNER"
              release_ref="${PR_BASE_REF:-}"
              candidate_sha="${PR_BASE_SHA:-}"
              test -n "$PR_NUMBER"
              changed_paths="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
              test -n "$changed_paths"
              if grep -Ev '^\.depulse-certification/resume/' <<< "$changed_paths" >/dev/null; then
                echo "ERROR: release/promotion PR fallback may change only fingerprint-excluded .depulse-certification/resume metadata" >&2
                printf '%s\n' "$changed_paths" >&2
                exit 2
              fi
              ;;
            *)
              echo "ERROR: unsupported release dispatcher event $GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac
          test -n "$release_ref"
          test -n "$candidate_sha"
          case "$release_ref" in
            "v${release_line}-release-certification") publish=false ;;
            "v${release_line}-stable-promotion") publish=true ;;
            *) echo "ERROR: release branch $release_ref does not match release identity $version" >&2; exit 2 ;;
          esac
          fingerprint="$(python3 source_fingerprint.py --mode git --commit "$candidate_sha")"
          certified_run_id=""
          if [ "$publish" = true ]; then
            certified_run_id="$(python3 - <<'PY'
          import json
          p='.depulse-certification/resume/release-evidence-checkpoint.json'
          d=json.load(open(p))
          value=(d.get('currentCandidate') or {}).get('certificationRunId')
          if value is None:
              value=(d.get('evidence') or {}).get('G11-G16',{}).get('runId')
          print('' if value is None else value)
          PY
            )"
            [[ "$certified_run_id" =~ ^[0-9]+$ ]]
          fi
          tracking_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "v${release_line}-development" --base main --state open --json number --jq '.[0].number // empty')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "certified_run_id=$certified_run_id" >> "$GITHUB_OUTPUT"
          echo "tracking_pr=$tracking_pr" >> "$GITHUB_OUTPUT"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
      - name: Announce dispatcher execution on release PR
        if: ${{ steps.release.outputs.tracking_pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_PR: ${{ steps.release.outputs.tracking_pr }}
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_FINGERPRINT: ${{ steps.release.outputs.fingerprint }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          CERTIFIED_RUN_ID: ${{ steps.release.outputs.certified_run_id }}
          RELEASE_REF: ${{ steps.release.outputs.release_ref }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          body="🚦 DE.PULSE v${VERSION} dispatcher active · Fast/dispatcher run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} · ref \`${RELEASE_REF}\` · target \`${CANDIDATE_SHA}\` · fingerprint \`${EXPECTED_FINGERPRINT}\` · publish=${PUBLISH} · certifiedRun=${CERTIFIED_RUN_ID:-n/a}. The next comment binds the canonical release/promotion run ID."
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_PR}/comments" -f body="$body" >/dev/null; then
            echo "::warning::PR tracking comment unavailable to workflow token; continuing and retaining release identity in Actions evidence."
          fi
      - id: dispatch
        name: Reuse or dispatch exact candidate release run
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          BUILD_ID: ${{ steps.release.outputs.build_id }}
          CERTIFICATION_SCRIPT: ${{ steps.release.outputs.script }}
          EXPECTED_FINGERPRINT: ${{ steps.release.outputs.fingerprint }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          CERTIFIED_RUN_ID: ${{ steps.release.outputs.certified_run_id }}
          TRACKING_PR: ${{ steps.release.outputs.tracking_pr }}
          RELEASE_REF: ${{ steps.release.outputs.release_ref }}
          CANDIDATE_SHA: ${{ steps.release.outputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$RELEASE_REF" --event workflow_dispatch --limit 20 --json databaseId,status,conclusion,headBranch,headSha,url --jq '.[] | select(.headBranch==env.RELEASE_REF and .headSha==env.CANDIDATE_SHA) | select(.status!="completed" or .conclusion=="success") | @base64' | head -n1)"
          if [ -n "$existing" ]; then
            run_json="$(printf '%s' "$existing" | base64 --decode)"
            run_id="$(printf '%s' "$run_json" | jq -r '.databaseId')"
            run_url="$(printf '%s' "$run_json" | jq -r '.url')"
            state="$(printf '%s' "$run_json" | jq -r 'if .status=="completed" then .conclusion else .status end')"
            echo "PASS: reusing release.yml run $run_id for $CANDIDATE_SHA ($state)"
          else
            before_ids="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$RELEASE_REF" --event workflow_dispatch --limit 20 --json databaseId --jq '.[].databaseId')"
            args=(
              --repo "$GITHUB_REPOSITORY"
              --ref "$RELEASE_REF"
              -f candidate_sha="$CANDIDATE_SHA"
              -f version="$VERSION"
              -f build_id="$BUILD_ID"
              -f certification_script="$CERTIFICATION_SCRIPT"
              -f expected_source_fingerprint="$EXPECTED_FINGERPRINT"
              -f publish="$PUBLISH"
            )
            if [ "$PUBLISH" = true ]; then
              [[ "$CERTIFIED_RUN_ID" =~ ^[0-9]+$ ]]
              args+=(-f certified_run_id="$CERTIFIED_RUN_ID")
            fi
            gh workflow run release.yml "${args[@]}"
            run_id=""
            run_url=""
            for _ in $(seq 1 30); do
              latest="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$RELEASE_REF" --event workflow_dispatch --limit 1 --json databaseId,headSha,url --jq '.[0] // {}')"
              candidate_id="$(printf '%s' "$latest" | jq -r '.databaseId // empty')"
              candidate_sha="$(printf '%s' "$latest" | jq -r '.headSha // empty')"
              if [ -n "$candidate_id" ] && [ "$candidate_sha" = "$CANDIDATE_SHA" ] && ! grep -qx "$candidate_id" <<< "$before_ids"; then
                run_id="$candidate_id"
                run_url="$(printf '%s' "$latest" | jq -r '.url')"
                break
              fi
              sleep 2
            done
            test -n "$run_id"
            echo "PASS: dispatched release.yml run $run_id for $CANDIDATE_SHA · v$VERSION · publish=$PUBLISH · certifiedRun=${CERTIFIED_RUN_ID:-n/a}"
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          {
            echo '## DE.PULSE release / promotion dispatch'
            echo "- release ref: \`$RELEASE_REF\`"
            echo "- target: \`$CANDIDATE_SHA\`"
            echo "- fingerprint: \`$EXPECTED_FINGERPRINT\`"
            echo "- publish: \`$PUBLISH\`"
            echo "- certified run reused: \`${CERTIFIED_RUN_ID:-n/a}\`"
            echo "- canonical run ID: \`$run_id\`"
            echo "- canonical run: $run_url"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TRACKING_PR" ]; then
            body="🔗 DE.PULSE v${VERSION} canonical release/promotion run: ${run_url} · run ${run_id} · target \`${CANDIDATE_SHA}\` · fingerprint \`${EXPECTED_FINGERPRINT}\` · publish=${PUBLISH} · certifiedRun=${CERTIFIED_RUN_ID:-n/a}. This run ID is a durable release lookup key for any assistant/account."
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${TRACKING_PR}/comments" -f body="$body" >/dev/null; then
              echo "::warning::Canonical run comment unavailable to workflow token; run identity remains retained in this Actions job and may be bound to PR #16 by the connected GitHub app."
            fi
          fi

  branch-hygiene:
    name: Remove only branches fully merged into main
    needs: fast
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply conservative branch hygiene
        run: python3 tools/ci/branch_hygiene.py --apply --json-out branch-hygiene.json
      - name: Retain cleanup report
        uses: actions/upload-artifact@v7
        with:
          name: DE-PULSE-branch-hygiene-${{ github.sha }}
          path: branch-hygiene.json
          if-no-files-found: error
          retention-days: 14
