name: DE.PULSE | CI Fast

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depulse-ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  GOVULNCHECK_VERSION: 'v1.1.4'
  NODE_VERSION: '24'
  PYTHON_VERSION: '3.13'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  fast:
    name: Fast impact-safe preflight
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - id: impact
        name: Deterministic impact plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci/impact_plan.py --base "${BASE_SHA:-}" --head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --json-out ci-impact-plan.json
      - name: Canonical workflow policy
        run: python3 tools/ci/workflow_policy.py
      - name: Recursive source-health / package discovery
        run: python3 tools/ci/source_health_architecture_gate.py
      - name: Repository migration safety
        run: python3 tools/ci/repository_migration_gate.py
      - name: Retired pre-v17 test/gate equivalence
        run: python3 tools/ci/retired_test_equivalence_gate.py
      - name: Active work-slice executable closure ledger
        run: python3 tools/ci/work_slice_closure_gate.py
      - name: Conserved v17/v18 requirement-ledger integrity
        run: python3 tools/ci/implementation_reconciliation_gate.py
      - name: Watchlist membership regression contract
        run: python3 tools/ci/watchlist_membership_contract.py
      - name: Adaptive resume portability contract
        run: python3 tools/ci/adaptive_resume_gate.py
      - name: Post-Stable continuity contract
        run: python3 tools/ci/post_stable_continuity_gate.py
      - name: V18 T1 feature reality and quality audit
        run: python3 tools/ci/v18_feature_assurance_ledger_gate.py
      - name: V18 T2 unit / contract / static / property assurance
        run: python3 tools/ci/v18_t2_unit_contract_assurance_gate.py
      - name: V18 T3 functional / integration / end-to-end assurance
        run: python3 tools/ci/v18_t3_functional_assurance_gate.py
      - name: V18 T4 edge / adversarial / failure / data-truth assurance
        run: python3 tools/ci/v18_t4_edge_failure_data_truth_assurance_gate.py
      - name: V18 T5 persistence / lifecycle / restart assurance
        run: python3 tools/ci/v18_t5_persistence_lifecycle_assurance_gate.py
      - name: V18 T6 security / roles / secrets / rights assurance
        run: python3 tools/ci/v18_t6_security_roles_rights_assurance_gate.py
      - name: V18 T7 UI / UX / IA / content / accessibility assurance
        run: python3 tools/ci/v18_t7_ui_ux_ia_content_assurance_gate.py
      - name: V18 T8 performance / load / soak / concurrency / resource assurance
        run: python3 tools/ci/v18_t8_performance_load_soak_concurrency_resource_assurance_gate.py
      - name: V18 T9 packaged / cross-platform / release / provenance assurance
        run: python3 tools/ci/v18_t9_packaged_cross_platform_release_assurance_gate.py
      - name: V19 requirement conservation
        run: python3 tools/ci/requirement_conservation_gate.py
      - name: V18 T10 future-proof / zero-gap / portability assurance
        run: python3 tools/ci/v18_t10_future_proof_zero_gap_certification_gate.py
      - name: Platform-neutral source provenance regression
        run: python3 tools/ci/source_provenance_test.py
      - name: Release identity
        run: python3 tools/release/release_identity.py --verify
      - name: Python syntax
        run: python3 -m compileall -q tools/ci tools/release tools/release/source_fingerprint.py
      - name: HOST-020 hosted deployment admission
        run: python3 tools/ci/hosted_deployment_admission_self_test.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: HOST-019 live Go advisory scan
        shell: bash
        run: |
          set -euo pipefail
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          {
            echo "source_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "go_version=$(go version)"
            echo "scanner=golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
            echo "database=https://vuln.go.dev"
          } > govulncheck-metadata.txt
          govulncheck -db https://vuln.go.dev ./... 2>&1 | tee govulncheck.txt
      - name: Retain HOST-019 advisory evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DE-PULSE-HOST019-govulncheck-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            govulncheck-metadata.txt
            govulncheck.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Go formatting
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          bad="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad"
            while IFS= read -r file; do
              [ -n "$file" ] && gofmt -d "$file" || true
            done <<< "$bad"
            exit 1
          fi
      - name: Go vet
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        run: go vet ./...
      - name: Go full unit/package suite
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        run: go test -count=1 ./...
      - name: PostgreSQL tagged compile
        if: ${{ steps.impact.outputs.go_required == 'true' }}
        run: go test -tags postgres -run '^$' ./...
      - name: Renderer JavaScript syntax
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find renderer -type f -name '*.js' -print0)
      - name: Surface consolidation regression
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        run: node tests/renderer/surface_consolidation_test.js
      - name: Role-aware documentation regression
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        run: node tests/renderer/documentation_access_test.js
      - name: Capability-scoped Administration regression
        if: ${{ steps.impact.outputs.node_required == 'true' }}
        run: node tests/renderer/administration_surface_test.js
      - name: Record exact-head Fast status
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state=success \
            -f context='DE.PULSE/fast-head' \
            -f description='CI Fast passed exact source head' \
            -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: CI summary
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo '## DE.PULSE CI Fast'
            echo "- exact source SHA: $HEAD_SHA"
            echo "- process-only: ${{ steps.impact.outputs.process_only }}"
            echo "- Go lane required: ${{ steps.impact.outputs.go_required }}"
            echo "- Node/renderer syntax required: ${{ steps.impact.outputs.node_required }}"
            echo '- release-state/coherence + governance checks complete before Go/Node setup'
            echo '- workflow policy: PASS'
            echo '- recursive source-health/package discovery: PASS'
            echo '- repository migration safety: PASS'
            echo '- retired pre-v17 test/gate equivalence: PASS'
            echo '- active work-slice closure-ledger enforcement: PASS'
            echo '- conserved v17/v18 ledger integrity: PASS'
            echo '- adaptive resume portability: PASS'
            echo '- post-Stable continuity: PASS'
            echo '- v18 T1 feature reality/quality structural audit: PASS'
            echo '- v18 T2 unit/contract/static/property census: PASS'
            echo '- v18 T3 functional/integration/end-to-end census: PASS'
            echo '- v18 T4 edge/adversarial/failure/data-truth census: PASS'
            echo '- v18 T5 persistence/lifecycle/restart census: PASS'
            echo '- v18 T6 security/roles/secrets/rights census: PASS'
            echo '- v18 T7 UI/UX/IA/content/accessibility census: PASS'
            echo '- v18 T8 performance/load/soak/concurrency/resource assurance: PASS'
            echo '- v18 T9 packaged/cross-platform/release/provenance assurance: PASS'
            echo '- v19 requirement conservation: PASS'
            echo '- v18 T10 future-proof/zero-gap/portability assurance: PASS'
            echo '- Git-object provenance: PASS'
            echo '- HOST-019 live govulncheck advisory scan: PASS (fail-closed)'
            echo '- HOST-020 source/SBOM/advisory/provenance/environment admission: PASS (fail-closed)'
            echo '- PostgreSQL tagged compile: PASS when Go lane is required; no live DB/PITR claim'
            echo '- exact-head status: DE.PULSE/fast-head'
            echo '- release dispatch: NOT PERMITTED from CI Fast'
          } >> "$GITHUB_STEP_SUMMARY"

  main-continuity:
    name: Post-Stable continuity sentinel
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Detect unreconciled post-Stable repository state
        run: python3 tools/ci/post_stable_continuity_gate.py
      - name: Validate aligned Stable evidence when present
        run: python3 tools/ci/stable_evidence_gate.py

  branch-hygiene:
    name: Remove merged and obsolete branches
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Apply conservative branch hygiene
        run: python3 tools/ci/branch_hygiene.py --apply --json-out branch-hygiene.json
      - name: Retain cleanup report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DE-PULSE-branch-hygiene-${{ github.sha }}
          path: branch-hygiene.json
          if-no-files-found: error
          retention-days: 7
