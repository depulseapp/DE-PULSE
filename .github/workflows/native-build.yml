name: DE.PULSE v18.0.4 Stable Certification

on:
  workflow_dispatch:
  push:
    branches:
      - v18.0.4-stable-promotion
    paths:
      - 'De-Pulse-v18.0.4-STABLE-Source.zip'

permissions:
  contents: read

concurrency:
  group: depulse-v1804-stable-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.6'
  SOURCE_ZIP: 'De-Pulse-v18.0.4-STABLE-Source.zip'

jobs:
  stable-g12:
    name: G12 Stable Source Certification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Stage Stable source
        shell: bash
        run: |
          mkdir -p input work/stable
          cp "$SOURCE_ZIP" input/De-Pulse-v18.0.4-STABLE-Source.zip
          echo 'a7fc226577a23ce89ad214183dfad73f11cde1e43b59eba08eedb200ddc0da2a  input/De-Pulse-v18.0.4-STABLE-Source.zip' | sha256sum -c -
          unzip -q input/De-Pulse-v18.0.4-STABLE-Source.zip -d work/stable
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify Stable fingerprint and promotion gates
        working-directory: work/stable
        shell: bash
        run: |
          test "$(python3 ci_pipeline.py --fingerprint)" = '9fa0e285cc90d7848aa7676a6169091a540601942f18422a31243b9ba6a8bee8'
          python3 v18_0_4_stable_promotion_gate.py
          python3 v18_0_4_scope_gate.py
          python3 v18_baseline_gate.py
          python3 v18_0_4_principal_engineer_gate.py
          python3 documentation_governance_gate.py
          python3 data_utility_gate.py
      - name: Full Go suite
        working-directory: work/stable
        run: go test -count=1 ./...
      - name: Race suite
        working-directory: work/stable
        run: go test -race -count=1 ./...
      - name: Randomized order gate
        working-directory: work/stable
        run: python3 randomized_order_gate.py
      - name: Extreme 30 gate
        working-directory: work/stable
        run: python3 extreme_30_gate.py
      - name: Renderer and deterministic regressions
        working-directory: work/stable
        shell: bash
        run: |
          node renderer_logic_test.js
          node deterministic_equivalence_test.js
          node trader_acceptance_test.js

  macos-apple-silicon:
    name: G14 macOS Apple Silicon Stable
    needs: [stable-g12]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Stage certified Stable source
        shell: bash
        run: |
          mkdir -p input
          cp "$SOURCE_ZIP" input/De-Pulse-v18.0.4-STABLE-Source.zip
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run G14 Stable native audit
        shell: bash
        run: bash ./scripts/stable-build-macos-arm64.sh
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.0.4-STABLE-G14-macOS-Apple-Silicon
          path: out/macos-arm64/**
          if-no-files-found: error
          retention-days: 90

  windows-x64:
    name: G14 Windows x64 Stable
    needs: [stable-g12]
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Stage certified Stable source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path input | Out-Null
          Copy-Item -LiteralPath $env:SOURCE_ZIP -Destination 'input/De-Pulse-v18.0.4-STABLE-Source.zip' -Force
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run G14 Stable native audit
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/stable-build-windows-x64.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.0.4-STABLE-G14-Windows-x64
          path: out/windows-x64/**
          if-no-files-found: error
          retention-days: 90

  release-assurance:
    name: G15 Stable Release Assurance
    needs: [stable-g12, macos-apple-silicon, windows-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: De-Pulse-v18.0.4-STABLE-G14-macOS-Apple-Silicon
          path: collected/macos
      - uses: actions/download-artifact@v8
        with:
          name: De-Pulse-v18.0.4-STABLE-G14-Windows-x64
          path: collected/windows
      - name: Verify G15 Stable release assurance
        run: python3 scripts/stable-verify-g14-g15.py --mac collected/macos --windows collected/windows --out assurance
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.0.4-STABLE-G15-Release-Assurance
          path: assurance/**
          if-no-files-found: error
          retention-days: 180
