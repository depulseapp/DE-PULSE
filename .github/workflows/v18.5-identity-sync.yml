name: DE.PULSE v18.5 | One-shot TEST Identity Formalizer

on:
  push:
    branches: [v18.5-development]
    paths:
      - release_identity.json
      - .github/workflows/v18.5-identity-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18.5-identity-sync
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  formalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v18.5-development
          fetch-depth: 0
      - name: Synchronize canonical TEST identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          x=json.load(open('release_identity.json'))
          assert x['version']=='18.5.0'
          assert x['channel']=='TEST'
          assert x['previous_stable']=='v18.4.0'
          assert x['runtime_config']=='PersonalMarketTerminal-v18.5.0-TEST'
          assert x['application_bundle']=='De-Pulse-v18.5.0-TEST.app'
          PY
          python3 release_identity.py --sync
          python3 release_identity.py --verify
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          test -z "$(find . -name '*.pyc' -print -quit)"
      - name: Commit synchronized identity and retire formalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DE.PULSE Release Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add VERSION.txt app_bootstrap.go renderer/renderer.js renderer/index.html certification_plan.json ci_pipeline_plan.json
          git rm .github/workflows/v18.5-identity-sync.yml
          git diff --cached --check
          git commit -m 'v18.5: synchronize TEST release identity'
          git push origin HEAD:v18.5-development
