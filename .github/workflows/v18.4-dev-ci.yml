name: DE.PULSE v18.4 Development Qualification

on:
  push:
    branches: [v18.4-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.4-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-contract:
    name: G0-G7 security contract + regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: G0-G3 immutable v18.4 scope
        run: |
          python3 v18_4_scope_gate.py
          python3 release_identity.py --verify
      - name: Source-health architecture budget
        run: python3 source_health_architecture_gate.py
      - name: Canonical formatting is clean
        run: |
          files="runtime_environment.go http_security.go http_auth.go http_api.go identity_model.go identity_reauth.go provider_data_rights.go provider_router.go v18_4_security_test.go v18_4_session_security_test.go v18_4_reauth_test.go v18_4_provider_rights_test.go"
          existing=""
          for f in $files; do test ! -f "$f" || existing="$existing $f"; done
          test -z "$existing" || { gofmt -d $existing | tee /tmp/gofmt.diff; test ! -s /tmp/gofmt.diff; }
      - name: v18.4 focused security and commercial-readiness tests
        run: |
          python3 v18_4_reauth_ui_gate.py
          node --check renderer/renderer.js
          go test -count=1 -run '^TestV184' ./...
      - name: Full default-build Go suite
        run: go test -count=1 ./...
      - name: Vet default build
        run: go vet ./...
      - name: Compile Windows x64 affected path
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/depulse-v184-windows.test .
      - name: Protected v18.3/market owners unchanged
        run: git diff --exit-code 35ef2a161e6a01c4f22fd0c9aecbe8920a7dace2...HEAD -- scanner.go preparation_types_liquidity.go validation_learning.go signal_validation.go persistence_backend_postgres.go persistence_repository.go
