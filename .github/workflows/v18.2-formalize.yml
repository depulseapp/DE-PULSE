name: DE.PULSE v18.2 Formalize G0-G3

on:
  push:
    branches: [v18.2-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18.2-formalize
  cancel-in-progress: true

jobs:
  formalize:
    if: "!contains(github.event.head_commit.message, 'v18.2 freeze G0-G3')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Synchronize TEST identity and freeze release contract
        run: |
          set -euo pipefail
          python3 release_identity.py --sync
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v18_test_profile.go'); s=p.read_text()
          s=s.replace('PersonalMarketTerminal-v18.1.0-TEST','PersonalMarketTerminal-v18.2.0-TEST')
          s=s.replace('v18.1.0 TEST','v18.2.0 TEST')
          s=s.replace('v18.0.6 Stable','v18.1.0 Stable')
          s=s.replace('"sourceVersion": "v18.0.6"','"sourceVersion": "v18.1.0"')
          s=s.replace('.v18.1.0-test-profile-migration.json','.v18.2.0-test-profile-migration.json')
          p.write_text(s)
          p=Path('v18_2_renderer_test.js'); s=p.read_text().replace('<title>DE.PULSE v18.2.0 TEST</title>','<title>DE.PULSE v18.2.0</title>'); p.write_text(s)
          d=Path('release/v18.2.0'); d.mkdir(parents=True,exist_ok=True)
          (d/'G0-EXACT-BASELINE.md').write_text('''# G0 Exact Baseline — v18.2.0\n\n- Incoming Stable: **v18.1.0 Stable**\n- Stable commit: `4b48c61ee103897e834f4ff7d24af07d4275a62c`\n- Immutable tag: `v18.1.0-stable`\n- Stable source SHA-256: `84a8f2ce4ca7a174b1b3a18cf17904bbbbb4528139c14644b9e07a287e2f0419`\n- v18.2 development starts from that promoted Stable commit.\n- Generated `__pycache__` debris is excluded from v18.2.\n- Rollback/provenance remains the immutable v18.1.0 tag and permanent release assets.\n- Product boundaries, deterministic desk formulas, shared intelligence core, and v18.1 user-workspace isolation are inherited unchanged.\n''')
          (d/'G1-IMMUTABLE-SCOPE.md').write_text('''# G1 Immutable Scope — v18.2.0\n\n1. Extend canonical `IdentityService`; no second identity/session store.\n2. Role-aware user creation for roles below actor authority.\n3. Role/status lifecycle with active OWNER/SUPER_OWNER safety.\n4. Temporary-password reset with forced change and session revocation.\n5. Redacted admin user/session visibility; never expose credential/token hashes.\n6. Presence states ACTIVE / IDLE / OFFLINE derived from canonical sessions.\n7. Session revoke plus SSE termination when revoked/expired.\n8. Compact OWNER/ADMIN-class Settings administration UI.\n9. USER/DEMO do not see admin controls.\n10. Preserve v18.1 per-user market-state isolation and shared fetch-once/calculate-once intelligence core.\n11. No v18.3 hosted PostgreSQL/web architecture.\n12. No execution scope and no deterministic Day/Swing/Long formula changes.\n''')
          (d/'G2-ARCHITECTURE-DATA-UTILITY.md').write_text('''# G2 Architecture / Data Utility — v18.2.0\n\n- Identity ownership remains `IdentityService` + `IdentityPersistentState`.\n- Presence is derived from persisted session `LastSeenAt`, idle/absolute expiry and revocation; no separate heartbeat database.\n- Long-lived SSE reuses the same session truth and closes after administrative revocation/expiry.\n- Administrative DTOs expose only operational fields required for user/session management. Password hashes, token hashes, opaque session tokens and secrets are excluded.\n- Market providers, evidence, Router/Rapid Move, canonical quotes and deterministic scoring remain shared global intelligence.\n- v18.1 `UserWorkspace` remains the owner of personal tracked symbols/watchlists/UI state.\n- REUSE/CONSOLIDATE before ADD is mandatory; no parallel account/session/presence implementation.\n''')
          (d/'G3-DESIGN-DEPENDENCY-READINESS.md').write_text('''# G3 Design / Dependency Readiness — v18.2.0\n\n- Existing Argon2id, opaque HttpOnly session, SameSite Strict, CSRF and RBAC middleware are reused.\n- New admin mutations remain authenticated, CSRF-protected and role-gated.\n- Admin UI is modular (`admin-v18.2.js` / `admin-v18.2.css`) and loaded after the canonical renderer.\n- Responsive rules cover desktop, tablet and narrow browser widths.\n- Native packaging targets remain macOS Apple Silicon and Windows x64.\n- Existing certification, responsive, HTTP, deterministic, security and native lifecycle harnesses remain blocking regressions.\n''')
          PY
          cat > v18_2_scope.json <<'JSON'
          {
            "version":"18.2.0","channel":"TEST","incomingStable":"v18.1.0","incomingStableCommit":"4b48c61ee103897e834f4ff7d24af07d4275a62c","incomingStableSourceSha256":"84a8f2ce4ca7a174b1b3a18cf17904bbbbb4528139c14644b9e07a287e2f0419","clauses":["canonical_identity_owner","role_hierarchy","user_lifecycle","password_reset_revokes_sessions","redacted_admin_views","session_truth_presence","sse_revocation","admin_settings_ui","normal_user_hidden","v181_workspace_preserved","no_v183_hosted_scope","no_execution_no_formula_change"]
          }
          JSON
          cat > v18_2_g0_g3_contract.json <<'JSON'
          {"schemaVersion":1,"release":"v18.2.0 TEST","gates":{"G0":"EXACT_BASELINE","G1":"IMMUTABLE_SCOPE","G2":"ARCHITECTURE_DATA_UTILITY","G3":"DESIGN_DEPENDENCY_READINESS"},"incomingStable":{"version":"v18.1.0","commit":"4b48c61ee103897e834f4ff7d24af07d4275a62c","sourceSha256":"84a8f2ce4ca7a174b1b3a18cf17904bbbbb4528139c14644b9e07a287e2f0419"},"hostedArchitectureDeferredTo":"v18.3"}
          JSON
          cat > v18_2_scope_gate.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import json,sys
          R=Path(__file__).resolve().parent; e=[]
          def need(ok,msg):
              if not ok:e.append(msg)
          i=json.loads((R/'release_identity.json').read_text()); s=json.loads((R/'v18_2_scope.json').read_text())
          need(i.get('version')=='18.2.0' and i.get('channel') in {'TEST','STABLE'},'v18.2 identity missing')
          need(i.get('previous_stable')=='v18.1.0' and i.get('patch_predecessor')=='v18.1.0','v18.1.0 predecessor drift')
          if i.get('channel')=='TEST':
              need(i.get('build_id')=='v18.2.0-test-admin-presence-sessions-20260814','TEST build identity drift')
              need(i.get('runtime_config')=='PersonalMarketTerminal-v18.2.0-TEST','isolated TEST runtime missing')
              need(i.get('application_bundle')=='De-Pulse-v18.2.0-TEST.app','TEST bundle missing')
          need(s.get('incomingStableCommit')=='4b48c61ee103897e834f4ff7d24af07d4275a62c','G0 commit drift')
          need(s.get('incomingStableSourceSha256')=='84a8f2ce4ca7a174b1b3a18cf17904bbbbb4528139c14644b9e07a287e2f0419','G0 source SHA drift')
          need(len(s.get('clauses',[]))==12,'scope clause count drift')
          a=(R/'identity_admin.go').read_text(); h=(R/'http_admin_identity.go').read_text(); api=(R/'http_api.go').read_text(); ui=(R/'renderer/admin-v18.2.js').read_text()
          for token in ['adminSnapshot','adminCreateUser','adminSetUserRole','adminSetUserStatus','adminResetPassword','adminRevokeSession']:
              need(token in a,token+' missing')
          for route in ['/api/admin/identity','/api/admin/users/create','/api/admin/users/role','/api/admin/users/status','/api/admin/users/reset-password','/api/admin/sessions/revoke']:
              need(route in api or route in ui,route+' missing')
          need('sessionIDActive(p.SessionID)' in api and 'touchSessionID(p.SessionID)' in api,'SSE lifecycle integration missing')
          need("['SUPER_OWNER','OWNER','ADMIN']" in ui and 'SESSION TRUTH' in ui,'role/presence UI boundary missing')
          need('postgres' not in a.lower() and 'postgres' not in h.lower(),'v18.3 hosted scope leaked into v18.2')
          if e:
              print('v18.2 Scope Gate: FAIL'); [print(' -',x) for x in e]; sys.exit(2)
          print('v18.2 Scope Gate: PASS · 12/12 clauses · canonical identity/session ownership preserved')
          PY
          chmod +x v18_2_scope_gate.py
          cat > v18_2_principal_engineer_gate.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          R=Path(__file__).resolve().parent; e=[]
          def need(ok,msg):
              if not ok:e.append(msg)
          admin=(R/'identity_admin.go').read_text(); pres=(R/'identity_presence.go').read_text(); ui=(R/'renderer/admin-v18.2.js').read_text()
          need('IdentityService' in admin,'canonical IdentityService not reused')
          need('PasswordHash' not in ui and 'TokenHash' not in ui,'credential material exposed to renderer')
          need('adminPresenceActiveWindow' in admin and 'sessionPresence' in admin,'presence not derived centrally')
          need('sessionIDActive' in pres,'long-lived session validity owner missing')
          need('canManageRole' in admin and 'activeCriticalOwnersLocked' in admin,'role hierarchy/owner safety missing')
          need('v182CanAdmin' in ui,'role-aware UI boundary missing')
          if e:
              print('v18.2 Principal Engineer Gate: FAIL'); [print(' -',x) for x in e]; sys.exit(2)
          print('v18.2 Principal Engineer Gate: PASS · one identity/session owner · redacted admin view · no hosted/execution scope')
          PY
          chmod +x v18_2_principal_engineer_gate.py
          gofmt -w app_bootstrap.go v18_test_profile.go identity_admin.go identity_presence.go http_admin_identity.go http_api.go v18_2_test.go
          python3 release_identity.py --verify
          python3 v18_2_scope_gate.py
          python3 v18_2_principal_engineer_gate.py
          node v18_2_renderer_test.js
          go test -count=1 -run '^TestV182' ./...
          go test -count=1 ./...
          go vet ./...
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add . ':!.github/workflows/v18.2-formalize.yml'
          if git diff --cached --quiet; then
            echo 'v18.2 Formalize: EXPECTED_NOOP · release contract already synchronized'
            exit 0
          fi
          git commit -m 'v18.2 freeze G0-G3 and TEST identity'
          git push origin HEAD:v18.2-development
