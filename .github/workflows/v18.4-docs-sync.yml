name: DE.PULSE v18.4 Sync TEST Documentation

on:
  push:
    branches: [v18.4-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18.4-docs-sync
  cancel-in-progress: true

jobs:
  sync:
    if: "!contains(github.event.head_commit.message, 'v18.4: sync TEST documentation')"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add current v18.4 TEST documentation sections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          version='18.4.0'
          build='v18.4.0-test-security-commercial-readiness-20260816'

          p=Path('README.md')
          old=p.read_text()
          marker='# DE.PULSE v18.4.0 TEST — Security / Commercial Readiness Hardening'
          if not old.startswith(marker):
              prior=old
              first, rest=prior.split('\n',1)
              prior='## Immediate Stable predecessor — v18.3.0 STABLE — PostgreSQL / Hosted Shared State\n'+rest
              current=f'''{marker}\n\n**Build:** `{build}`  \n**Channel:** TEST  \n**Current Stable baseline:** v18.3.0  \n**Major v18 provenance anchor:** v17.5.1  \n**Patch predecessor:** v18.3.0 STABLE  \n**Application bundle:** `De-Pulse-v18.4.0-TEST.app`  \n**Runtime/config:** `PersonalMarketTerminal-v18.4.0-TEST`\n\nv18.4 TEST hardens the existing secure multi-user/hosted platform without changing market-scoring formulas or provider routing authority. It adds fresh password re-authentication for high-impact mutations, hosted per-user request quotas with aggregate diagnostics, and explicit provider data-rights/commercial-readiness metadata. Commercial, redistribution and AI-use readiness remain fail-closed unless provider-specific evidence is bound; a working API key never implies legal/commercial approval.\n\nDesktop remains SQLite/local by default and hosted PostgreSQL/shared-state behavior from v18.3 is preserved. Smart Provider Router v2 execution, protected deterministic Day/Swing/Long formulas and the permanent **No Execution Boundary** remain unchanged. v18.4 TEST uses an isolated profile cloned from the v18.3 Stable profile on first use.\n\n'''
              p.write_text(current+prior)

          docs={
            'renderer/docs/user.md': '''## v18.4.0 TEST — Security / commercial readiness hardening\n\nv18.4 TEST adds fresh password confirmation for security-sensitive settings/admin changes, hosted request-abuse safeguards and explicit provider commercial/data-rights readiness. Normal research/market workflows are not re-auth gated. Provider commercial, redistribution and AI-use rights are never inferred from a configured API key; unreviewed rights remain visibly blocked/review-required in governance metadata.\n\nThe TEST build uses `PersonalMarketTerminal-v18.4.0-TEST` so the v18.3 Stable profile is not modified. Desktop storage remains SQLite by default; hosted PostgreSQL/shared-state behavior, Smart Provider Router execution, deterministic Day/Swing/Long formulas and the **No Execution** boundary remain unchanged.\n\n''',
            'renderer/docs/developer.md': '''## v18.4.0 TEST — Security / commercial-readiness architecture\n\nv18.4 extends the existing HTTP security/auth boundary and runtime telemetry instead of creating parallel owners. Fresh re-authentication protects only high-impact mutations. Hosted mutation/expensive-work quotas are keyed from verified identity after canonical auth/CSRF resolution, use bounded in-memory windows, return deterministic HTTP 429/`Retry-After`, and expose aggregate counters without raw user/session/IP identifiers.\n\nProvider `DataRights` / `CommercialReadiness` metadata is governance-only and fails closed unless evidence plus explicit commercial/redistribution/AI-use approval are bound. Structural tests prevent those fields from entering Smart Router eligibility/scoring or executable routing. v18.3 PostgreSQL/shared-state owners and protected deterministic formulas are unchanged.\n\n''',
            'renderer/docs/limitations.md': '''## v18.4.0 TEST — commercial/data-rights boundary\n\nv18.4 does **not** assert that any provider is commercially approved, redistributable or approved for AI/LLM use merely because an endpoint is public, configured or operational. Current default provider rights are `UNREVIEWED` / `NOT_ASSERTED`, and commercial readiness is fail-closed until provider-specific evidence is bound. Legal/licensing interpretation remains an explicit review responsibility rather than an inferred runtime fact.\n\nHosted request quotas are abuse/capacity safeguards, not provider-entitlement limits and not a guarantee against upstream rate limits. They do not change desktop behavior or provider routing. v18.4 remains research/intelligence/decision support only; the **No Execution** boundary is unchanged.\n\n'''
          }
          for name, section in docs.items():
              p=Path(name); text=p.read_text(); lines=text.splitlines(True)
              if '## v18.4.0 TEST' not in ''.join(lines[:30]):
                  first=lines[0]
                  rest=''.join(lines[1:]).lstrip('\n')
                  p.write_text(first+'\n'+section+rest)
          PY
          python3 version_consistency_test.py
          python3 documentation_governance_gate.py
      - name: Commit documentation synchronization only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- README.md renderer/docs/user.md renderer/docs/developer.md renderer/docs/limitations.md
          if git diff --cached --quiet; then
            echo 'v18.4 docs sync: EXPECTED_NOOP'
            exit 0
          fi
          git commit -m 'v18.4: sync TEST documentation'
          git push origin HEAD:v18.4-development
