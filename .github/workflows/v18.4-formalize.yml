name: DE.PULSE v18.4 Formalize TEST Identity

on:
  push:
    branches: [v18.4-development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v18.4-formalize
  cancel-in-progress: true

jobs:
  formalize:
    if: "!contains(github.event.head_commit.message, 'v18.4: bind TEST release identity')"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Synchronize v18.4 TEST identity and isolated runtime profile
        shell: bash
        run: |
          set -euo pipefail
          python3 release_identity.py --sync
          python3 - <<'PY'
          from pathlib import Path
          p=Path('v18_test_profile.go')
          s=p.read_text()
          s=s.replace('v18.3.0','v18.4.0')
          s=s.replace('v18.2.0','v18.3.0')
          p.write_text(s)
          PY
          gofmt -w app_bootstrap.go v18_test_profile.go
          python3 release_identity.py --verify
          python3 v18_4_scope_gate.py
          python3 source_health_architecture_gate.py
          node --check renderer/renderer.js
          go test -count=1 -run '^TestV184' ./...
          go test -count=1 ./...
          go vet ./...
      - name: Commit synchronized identity only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- VERSION.txt app_bootstrap.go renderer/renderer.js renderer/index.html certification_plan.json ci_pipeline_plan.json v18_test_profile.go
          if git diff --cached --quiet; then
            echo 'v18.4 Formalize: EXPECTED_NOOP · identity already synchronized'
            exit 0
          fi
          git commit -m 'v18.4: bind TEST release identity'
          git push origin HEAD:v18.4-development
