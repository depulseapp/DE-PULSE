name: DE.PULSE v18.3 HTTP Ownership Refactor Builder

on:
  push:
    branches: [v18.3-development]
    paths:
      - '.depulse-build/v18.3-http-ownership.patch'
      - '.github/workflows/v18.3-http-ownership-builder.yml'

permissions:
  contents: write

concurrency:
  group: v18.3-http-ownership-builder
  cancel-in-progress: false

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Verify exact parent and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '60b4d78a7e8b6f156fe95c7686403336cbf0a227'
          test "$(git hash-object .depulse-build/v18.3-http-ownership.patch)" = '64cd060740ebac0f005fae21d94acd0d648da525'
          git apply --check .depulse-build/v18.3-http-ownership.patch
          git apply .depulse-build/v18.3-http-ownership.patch
          gofmt -w http_api.go http_health.go
      - name: Architecture budget and bounded regression
        shell: bash
        run: |
          set -euo pipefail
          python3 source_health_architecture_gate.py
          python3 release_identity.py --verify
          python3 v18_3_scope_gate.py
          python3 v18_3_principal_engineer_gate.py
          go test -count=1 -run '^TestV183' ./...
          go test -count=1 ./...
          go vet ./...
      - name: Publish qualified product refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- http_api.go http_health.go
          git commit -m 'v18.3: separate hosted health HTTP ownership'
          git push origin HEAD:v18.3-development
