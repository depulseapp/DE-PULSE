name: DE.PULSE v18.3 Development Qualification

on:
  push:
    branches: [v18.3-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.3-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-contract:
    name: G0-G5 desktop contract + regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: G0-G3 release identity and immutable scope
        run: |
          python3 release_identity.py --verify
          python3 version_consistency_test.py
          python3 v18_3_scope_gate.py
      - name: Canonical formatting is clean
        run: |
          files="app_bootstrap.go v18_test_profile.go runtime_environment.go main.go http_api.go persistence_repository.go persistence_backend_select.go persistence_backend_postgres_stub.go persistence_backend_postgres.go persistence_backend_sqlite.go persistence_backend_fallback.go persistence_backend_windows.go v18_3_foundation_test.go v18_3_postgres_test.go"
          gofmt -d $files | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
      - name: v18.3 focused default-build tests
        run: go test -count=1 -run '^TestV183' ./...
      - name: Full default-build Go suite
        run: go test -count=1 ./...
      - name: Vet default desktop build
        run: go vet ./...
      - name: Protected deterministic source unchanged from v18.2 Stable
        run: git diff --exit-code v18.2.0-stable...HEAD -- scanner.go preparation_types_liquidity.go validation_learning.go signal_validation.go

  postgres-parity:
    name: G6-G8 PostgreSQL parity + hosted readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: depulse
          POSTGRES_PASSWORD: depulse-test-only
          POSTGRES_DB: depulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U depulse -d depulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DEPULSE_TEST_POSTGRES_URL: postgres://depulse:depulse-test-only@127.0.0.1:5432/depulse_test?sslmode=disable
      DEPULSE_DATABASE_URL: postgres://depulse:depulse-test-only@127.0.0.1:5432/depulse_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Fetch hosted PostgreSQL dependency
        run: go mod download
      - name: Real PostgreSQL repository/migration/concurrency tests
        run: go test -tags postgres -count=1 -run '^TestV183Postgres' ./...
      - name: Vet hosted PostgreSQL build
        run: go vet -tags postgres ./...
      - name: Build hosted target
        run: go build -tags postgres -o /tmp/depulse-hosted .
      - name: Actual hosted health/readiness smoke
        env:
          DEPULSE_RUNTIME_MODE: hosted
          DEPULSE_PERSISTENCE_BACKEND: postgres
          DEPULSE_CONFIG_DIR: /tmp/depulse-v183-hosted
          DEPULSE_LISTEN_ADDR: 127.0.0.1:18083
        run: |
          set -euo pipefail
          /tmp/depulse-hosted >/tmp/depulse-hosted.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18083/api/health >/tmp/health.json && curl -fsS http://127.0.0.1:18083/api/ready >/tmp/ready.json; then
              break
            fi
            sleep 1
          done
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json')); r=json.load(open('/tmp/ready.json'))
          assert h['ok'] is True and h['runtimeMode']=='hosted', h
          assert r['ok'] is True and r['runtimeMode']=='hosted', r
          assert r['persistence']['backend']=='postgresql' and r['persistence']['ready'] is True, r
          print('Hosted runtime readiness: PASS · PostgreSQL canonical persistence ready')
          PY
          kill "$pid"
          wait "$pid" || true
          trap - EXIT
      - name: Emit resolved dependency checksums for source freeze
        if: always()
        run: |
          test -f go.sum && cat go.sum || true
