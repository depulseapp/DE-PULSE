name: DE.PULSE v18.3 Slice2 One-Shot Builder
on:
  push:
    branches: [v18.3-development]
    paths:
      - '.depulse-build/v18.3-slice2/**'
      - '.github/workflows/v18.3-slice2-builder.yml'
permissions:
  contents: write
concurrency:
  group: v18.3-slice2-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false
      - name: Verify exact foundation and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'fc42b5335079e59e08703793e85e12fbf9d0e38d'
          cat .depulse-build/v18.3-slice2/chunk* | base64 -d > /tmp/slice.patch.gz
          echo '1472a8789fd2127debfd71fae9feee0d6d68ac94404634bd7bce52b741dec7e8  /tmp/slice.patch.gz' | sha256sum -c -
          gzip -dc /tmp/slice.patch.gz > /tmp/slice.patch
          echo '6896a5f3ea35b6ede7735d10afcf94a53e583f4ff509fc7545119ff3dc3e6e1f  /tmp/slice.patch' | sha256sum -c -
          git apply --check /tmp/slice.patch
          git apply /tmp/slice.patch
      - name: Canonical formatting
        run: gofmt -w app_state.go http_api.go persistence_archive.go persistence_backend_fallback.go persistence_backend_postgres.go persistence_backend_select.go persistence_backend_sqlite.go persistence_backend_windows.go persistence_repository.go v18_3_foundation_test.go v18_3_postgres_test.go
      - name: Bound slice and qualify default/cross-platform paths
        shell: bash
        run: |
          set -euo pipefail
          python3 release_identity.py --verify
          python3 version_consistency_test.py
          python3 v18_3_scope_gate.py
          python3 v18_3_principal_engineer_gate.py
          go test -count=1 -run '^TestV183' ./...
          go test -count=1 ./...
          go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go test -c -o /tmp/depulse-v183-windows.test .
          go test -tags postgres -run '^$' ./...
          go vet -tags postgres ./...
      - name: Commit qualified slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- README.md app_state.go http_api.go persistence_archive.go persistence_backend_fallback.go persistence_backend_postgres.go persistence_backend_select.go persistence_backend_sqlite.go persistence_backend_windows.go persistence_repository.go release/v18.3.0/G2-ARCHITECTURE-DATA-UTILITY.md release/v18.3.0/G3-DESIGN-DEPENDENCY-READINESS.md renderer/docs/developer.md renderer/docs/limitations.md renderer/docs/user.md v18_3_foundation_test.go v18_3_postgres_test.go v18_3_principal_engineer_gate.py v18_3_scope_gate.py
          git commit -m 'v18.3: persistence migration backup and recovery hardening'
          git push origin HEAD:v18.3-development
