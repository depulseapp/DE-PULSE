name: DE.PULSE v18.5 | G0-G5 Major Closure Baseline

on:
  push:
    branches: [v18.5-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v18.5-dev-ci
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.6'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  g0-g3-freeze:
    name: G0-G3 · Exact Baseline / Scope / Architecture / Design
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Verify immutable v18.5 closure scope
        shell: bash
        run: |
          set -euo pipefail
          python3 v18_5_scope_gate.py
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 documentation_governance_gate.py
          git cat-file -e 'v18.4.0-stable^{commit}'
          test "$(git rev-parse 'v18.4.0-stable^{commit}')" = '8f3d0db3a7b7300f5954bd34af2541a0e04d6870'
      - name: Record G0-G3 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,datetime,pathlib,subprocess
          out={
            'schemaVersion':1,'release':'v18.5.0','phase':'G0-G3','status':'PASS',
            'incomingStableTag':'v18.4.0-stable',
            'incomingStableCommit':'8f3d0db3a7b7300f5954bd34af2541a0e04d6870',
            'incomingStableFingerprint':'97eb553241eb98bda25f1867ea9f9ebfbaa4fe95e110960a8a4d5e7fc28eb05b',
            'headCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'checks':{'scopeGate':True,'sourceArchitecture':True,'dataUtility':True,'documentationGovernance':True},
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('evidence/G0-G3.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.0-G0-G3-Baseline
          path: evidence/G0-G3.json
          if-no-files-found: error
          retention-days: 365

  g4-g5-closure-baseline:
    name: G4/G5 · Development Exit + FAST Closure Qualification
    needs: [g0-g3-freeze]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Source/static/developer-proof baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 v18_5_scope_gate.py
          python3 code_quality_performance_gate.py --static-only
          python3 source_health_architecture_gate.py
          python3 data_utility_gate.py
          python3 functionality_utility_checkpoint_gate.py
          go vet ./...
      - name: Inherited degradation / backpressure / readiness focused tests
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -run '^TestV170' ./...
          go test -count=1 -run '^TestV171' ./...
          go test -count=1 -run '^TestV172' ./...
          go test -count=1 -run '^TestV174' ./...
      - name: Inherited performance/stability gates
        shell: bash
        run: |
          set -euo pipefail
          python3 v16_11_performance_stability_gate.py
          python3 v16_10_performance_gate.py
      - name: Focused race + CGO-disabled fallback
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 -run '^(TestV171|TestV172)' ./...
          CGO_ENABLED=0 go test -count=1 -run '^(TestV170|TestV171|TestV172|TestV174)' ./...
      - name: Record G4/G5 baseline evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          FP="$(python3 ci_pipeline.py --fingerprint)"
          python3 - "$FP" <<'PY'
          import json,datetime,pathlib,subprocess,sys
          out={
            'schemaVersion':1,'release':'v18.5.0','phase':'G4-G5','status':'PASS',
            'headCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'sourceFingerprint':sys.argv[1],
            'checks':{
              'staticSourceQuality':True,'sourceArchitecture':True,'dataUtility':True,'functionalityUtility':True,'vet':True,
              'v170PersistenceLoadDegradation':True,'v171PriorityBackpressureProviderBudget':True,
              'v172CanonicalPropagationLineage':True,'v174ReadinessTruth':True,
              'v1611PerformanceStability':True,'v1610RadarPerformance':True,
              'focusedRace':True,'cgoDisabledFallback':True
            },
            'decision':'BASELINE_CLOSURE_GREEN_CONTINUE_TO_ADR_GDI_MATRIX',
            'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          pathlib.Path('evidence/G4-G5.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: De-Pulse-v18.5.0-G4-G5-Baseline
          path: evidence/G4-G5.json
          if-no-files-found: error
          retention-days: 365
